name: Last Luas source snapshot
on:
  push:
    branches: [last-luas-inked-implementation]
    paths: ['.github/workflows/last-luas-source-export.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet cryptography
      - name: Prepare encrypted private artwork and owner identity reference
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/last-luas-private-reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: last-luas-encrypted-reference
          path: /tmp/last-luas-private.encrypted.json
          retention-days: 1
