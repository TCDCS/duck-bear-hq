name: Last Luas source import
on:
  push:
    branches: [last-luas-inked-implementation]
    paths: ['.github/workflows/last-luas-source-export.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: last-luas-inked-implementation
      - name: Validate and apply the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, re, subprocess
          expected=['0fbea801ab0aa957e675de1427908e9fdb4bb9d73988d7cbae04522092e4358b','96e88b3e3d4a81be4bfb12be096a353c7d4f9f9ab6782c7afbad8e309d2b5edf','c9ae1d4f8330d7f558bd09b808f13f771a5f930bfc6aa9096980a72349d43109','80d5e22e679457d1310a9eb72472b6534d7163fbaf8bed9c0629d68f47121bbb','e3bc72cb710d06d6a45757b66eb31d1b6dacaea9225f4814374a9a867a49c8ce']
          parts=[]
          for i,sha in enumerate(expected):
            raw=pathlib.Path(f'.last-luas-transfer/part-{i:02}.txt').read_bytes().strip()
            actual=hashlib.sha256(raw).hexdigest()
            print(f'Part {i}: {len(raw)} bytes, sha256 {actual}')
            assert actual==sha, f'Transfer part {i} does not match the reviewed source'
            parts.append(raw)
          encoded=b''.join(parts)
          assert len(encoded)==56968
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)==146519
          assert hashlib.sha256(patch).hexdigest()=='d889706c531acabe261b81f704b387bb092f507e53d0820d29cae9867f99db2f'
          paths=re.findall(rb'^diff --git a/(.*?) b/',patch,re.M)
          allowed={b'.gitignore',b'public/_headers',b'public/games/index.html',b'public/index.html',b'public/kart-games.js',b'src/index.js',b'src/worker-games.js',b'wrangler.jsonc'}
          for path in paths:
            assert path in allowed or path.startswith((b'public/games/last-luas/',b'src/last-luas/',b'tests/last-luas',b'scripts/last-luas-')),path
          pathlib.Path('/tmp/last-luas.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','/tmp/last-luas.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','/tmp/last-luas.patch'],check=True)
          h=pathlib.Path('public/_headers');h.write_text(h.read_text().rstrip()+'\n')
          old=subprocess.check_output(['git','rev-parse','HEAD:public/games/last-luas/game.mjs'],text=True).strip()
          assert old=='fa5252c1a03bc1e54c8b20d82d5ac17df49aead8','Old game changed; reconcile instead of deleting'
          subprocess.run(['git','rm','public/games/last-luas/game.mjs'],check=True)
          subprocess.run(['git','rm',*[f'.last-luas-transfer/part-{i:02}.txt' for i in range(5)]],check=True)
          PY
          git diff --check
          git add .gitignore public src tests scripts wrangler.jsonc
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild Last Luas with inked Canvas art, real-logo delivery and tested runner rules'
          git push origin HEAD:last-luas-inked-implementation
