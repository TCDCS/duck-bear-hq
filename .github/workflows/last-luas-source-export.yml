name: Last Luas source snapshot
on:
  push:
    branches: [last-luas-inked-implementation]
    paths: ['.github/workflows/last-luas-source-export.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet cryptography
      - run: python scripts/last-luas-review-pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: last-luas-review-v2
          path: /tmp/last-luas-review.encrypted.json
          retention-days: 1
