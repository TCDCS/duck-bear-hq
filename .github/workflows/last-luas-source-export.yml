name: Last Luas source snapshot
on:
  push:
    branches: [last-luas-inked-implementation]
    paths: ['.github/workflows/last-luas-source-export.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Audit official identity URLs and bounded OSM geometry
        run: python scripts/last-luas-reference-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: last-luas-reference
          path: /tmp/last-luas-reference/
          retention-days: 1
