name: Books reader verification
on:
  push:
    branches: [feature/books-reader-2026-10-03]
  pull_request:
    paths:
      - 'src/books/**'
      - 'public/books/**'
      - 'public/hq/**'
      - 'src/hq/**'
      - 'src/worker-games.js'
      - 'tests/books*'
      - 'tests/books/**'
      - 'tools/books/**'
      - 'scripts/build-books.mjs'
      - 'package*.json'
      - '.github/workflows/books-reader.yml'
permissions:
  contents: read
concurrency:
  group: books-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p verification
      - run: npm ci
      - name: Record dependency audit
        run: npm audit --json > verification/dependency-audit.json || true
      - name: All existing and new unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee verification/unit-tests.log
      - name: Repository checks and reader assets
        run: |
          set -o pipefail
          npm run check 2>&1 | tee verification/repository-checks.log
      - name: Install browser-test dependencies
        run: |
          python -m pip install playwright reportlab
          python -m playwright install --with-deps chromium
      - name: Browser tests with synthetic books only
        run: |
          python tools/books/make-fixtures.py
          node --experimental-sqlite tools/books/dev-server.mjs > verification/dev-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8788/books/ >/dev/null && break; sleep 1; done
          set -o pipefail
          python tools/books/browser_test.py 2>&1 | tee verification/browser-tests.log
      - name: Record exact tested source
        if: always()
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/tested-commit.txt
          git status --short > verification/working-tree.txt
          cat verification/tested-commit.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: books-reader-evidence
          path: verification/
          retention-days: 7
      - name: Preserve development source for offline diagnosis
        if: always() && github.event_name == 'push'
        run: |
          git archive --format=tar HEAD > /tmp/books-source.tar
          gzip /tmp/books-source.tar
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: books-source-snapshot
          path: /tmp/books-source.tar.gz
          retention-days: 3
          compression-level: 0
