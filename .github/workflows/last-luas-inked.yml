name: Last Luas inked acceptance
on:
  pull_request:
    paths:
      - 'public/games/last-luas/**'
      - 'src/last-luas/**'
      - 'scripts/last-luas-*'
      - 'tests/last-luas*'
      - 'wrangler.jsonc'
      - '.github/workflows/last-luas-inked.yml'
  push:
    branches: [last-luas-inked-implementation]
    paths: ['.github/workflows/last-luas-inked.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm test && npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/last-luas-worker
      - run: npx wrangler d1 migrations apply DB --local
      - run: python -m pip install --quiet playwright cryptography
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/last-luas-private-assets.py local
      - run: python scripts/last-luas-local-fixture.py
      - name: Real Worker and native browser acceptance
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/last-luas-worker.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(90):
           try:
            with urllib.request.urlopen('http://127.0.0.1:8787/api/last-luas/release',timeout=2) as r:
             if r.status==200:break
           except Exception:time.sleep(1)
          else:raise SystemExit('Local Worker did not become ready')
          PY
          python scripts/last-luas-browser.py
      - name: Encrypt actual browser captures
        if: always()
        run: python scripts/last-luas-seal.py /tmp/last-luas-browser /tmp/last-luas-browser.encrypted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-luas-inked-browser-encrypted
          path: /tmp/last-luas-browser.encrypted.json
          retention-days: 1
