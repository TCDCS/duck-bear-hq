name: Complete family chart delivery
on:
  push:
    branches: [codex/family-whole-tree-20261003]
    paths: ['.family-whole-delivery.json']
permissions:
  contents: write
concurrency:
  group: family-whole-delivery
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/family-whole-tree-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify generic source package and unchanged base
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';import {createHash} from 'node:crypto';import {gunzipSync} from 'node:zlib';import {dirname} from 'node:path';
          const d=JSON.parse(await readFile('.family-whole-delivery.json','utf8'));const r=await fetch(d.url,{signal:AbortSignal.timeout(45000)});if(!r.ok)throw Error('Source unavailable');const b=Buffer.from(await r.arrayBuffer());const hash=x=>createHash('sha256').update(x).digest('hex');if(hash(b)!==d.sha256)throw Error('Source hash mismatch');const patch=JSON.parse(gunzipSync(b));
          for(const f of patch.files){if(!/^(src\/hq|public\/hq|tests|docs)\/[\w./-]+$/.test(f.path)||f.path.includes('..'))throw Error('Invalid path');let old=null;try{old=await readFile(f.path);}catch{}if((old?hash(old):null)!==f.before)throw Error('Source changed since reviewed base: '+f.path);}
          for(const f of patch.files){await mkdir(dirname(f.path),{recursive:true});await writeFile(f.path,f.content);}
          await writeFile('/tmp/family-whole-files.json',JSON.stringify(patch.files.map(f=>f.path)));
          console.log('Verified generic source files:',patch.files.length);
          NODE
      - run: npm ci
      - run: timeout 180 npm test
      - run: npm run check
      - name: Browser dependencies
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Synthetic family and PDF browser acceptance
        run: |
          node tests/helpers/family-browser-server.mjs > /tmp/family-browser.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8793/hq/family.mjs >/dev/null && break; sleep 1; done
          timeout 240 python tests/family-browser.py
          timeout 240 python tests/family-books-browser.py
      - name: Save synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-whole-tree-evidence
          path: family-acceptance/
          retention-days: 3
      - name: Commit only verified source and remove temporary transport
        run: |
          git config user.name 'Duck Bear Family Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';import {execFileSync} from 'node:child_process';
          execFileSync('git',['add','--',...JSON.parse(await readFile('/tmp/family-whole-files.json','utf8'))]);
          NODE
          git rm .family-whole-delivery.json .github/workflows/family-whole-delivery.yml
          git commit -m 'fix: complete connected family layouts and recorded full dates'
          git push origin HEAD:codex/family-whole-tree-20261003
