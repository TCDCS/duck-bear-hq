name: Wacky Races isolated build
on:
  push:
    branches: [build/wacky-final-20260912]
    paths: ['.wacky-v4/**']
permissions:
  contents: write
jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checked source bundle
        run: python .wacky-v4/apply.py
      - name: Install build and browser tools
        run: |
          npm install --no-audit --no-fund
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unit, privacy, configuration and build checks
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir /tmp/wacky-build
          npx wrangler d1 migrations apply DB --local
      - name: Native Workers runtime and two-browser race
        env:
          BASE_URL: http://127.0.0.1:8787
        run: |
          mkdir -p verification
          npx wrangler dev --ip 127.0.0.1 --port 8787 > verification/wrangler.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/races/version && break; sleep 1; done
          python tests/browser_clients.py
      - name: Commit verified source to this build branch only
        run: python .wacky-v4/stage.py
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wacky-v4-verification
          path: verification/
          retention-days: 7
