name: Import and verify Mango Mayhem release
on:
  push:
    branches: [mango-mayhem-release]
    paths: ['.mango-release/manifest.json']
permissions:
  contents: write
concurrency:
  group: mango-source-import
  cancel-in-progress: false
jobs:
  import-and-verify:
    if: github.repository == 'chambersbtap/duck-bear-hq' && github.ref == 'refs/heads/mango-mayhem-release'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mango-mayhem-release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify archive and individual source hashes before extraction
        run: |
          python - <<'PY'
          import base64,hashlib,io,json,lzma,pathlib,tarfile
          root=pathlib.Path.cwd();stage=root/'.mango-release'
          manifest=json.loads((stage/'manifest.json').read_text())
          assert manifest['format']=='tar.xz+base64'
          assert 1<=len(manifest['parts'])<=20
          assert all(pathlib.PurePosixPath(p).name==p and p.startswith('part-') for p in manifest['parts'])
          encoded=''.join((stage/p).read_text().strip() for p in manifest['parts'])
          assert len(encoded)<500000
          packed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(packed).hexdigest()==manifest['sha256'],'Release archive hash mismatch'
          decoder=lzma.LZMADecompressor();raw=decoder.decompress(packed,max_length=2000001)
          assert decoder.eof and len(raw)<=2000000,'Expanded archive exceeds limit'
          exact={'public/games/index.html','public/games/games.css','public/games/hub.mjs','public/mango-card.css','migrations/0003_mango_profiles.sql','docs/mango-mayhem-release.md','scripts/integrate-mango.py'}
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:') as archive:
            members=archive.getmembers();assert len(members)<=120
            assert sorted(m.name for m in members)==sorted(manifest['files'])
            for member in members:
              name=member.name;target=(root/name).resolve()
              assert member.isfile() and root in target.parents and member.size<200000
              assert name in exact or name.startswith(('public/games/mango-mayhem/','src/mango/','tests/mango-','tests/helpers/mango-','scripts/mango-'))
              data=archive.extractfile(member).read()
              assert hashlib.sha256(data).hexdigest()==manifest['fileHashes'][name],name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          print('Verified and imported',len(members),'release source files.')
          PY
          python scripts/integrate-mango.py
      - name: Commit expanded source only to the release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .mango-release
          git rm .github/workflows/mango-import.yml
          git add public src tests scripts migrations docs/mango-mayhem-release.md README.md package.json
          git commit -m 'Build complete Mango Mayhem six-level platform game and profile saves'
          git push origin HEAD:mango-mayhem-release
      - name: Test full game and existing website before promotion
        run: bash scripts/mango-verify.sh
      - name: Package game source without private account files
        if: always()
        run: |
          mkdir -p verification/mango
          if [ -d public/games/mango-mayhem ]; then
            tar --exclude='__pycache__' -czf verification/mango/release-files.tar.gz public/games public/mango-card.css src/mango migrations/0003_mango_profiles.sql scripts/mango* scripts/integrate-mango.py tests/mango* tests/helpers/mango* docs/mango-mayhem-release.md
          fi
      - name: Save verification reports and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mango-import-verification
          path: verification/
          retention-days: 7
