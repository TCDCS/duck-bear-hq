name: Danao Unity Build Automation API

on:
  workflow_dispatch:
  push:
    branches: [feature/danao-unity]
    paths:
      - 'unity/danao/cloud-build-trigger.json'

permissions:
  contents: read

env:
  UNITY_UBA_API: https://build-automation.services.api.unity.com/v2
  UNITY_UBA_AUTH: ${{ secrets.UNITY_UBA_AUTH }}
  UNITY_UBA_ORG_ID: ${{ secrets.UNITY_UBA_ORG_ID }}
  UNITY_UBA_PROJECT_ID: ${{ secrets.UNITY_UBA_PROJECT_ID }}

jobs:
  trigger-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve requested target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET="webgl"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TARGET="$(jq -r '.target // empty' unity/danao/cloud-build-trigger.json)"
          fi
          test "$TARGET" = "webgl" || { echo "Danao is browser-only; unsupported build target: $TARGET" >&2; exit 2; }
          echo "key=webgl" >> "$GITHUB_OUTPUT"
          echo "name=Danao WebGL" >> "$GITHUB_OUTPUT"

      - name: Check Unity Build Automation credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_UBA_AUTH" || { echo 'Missing UNITY_UBA_AUTH repository secret'; exit 1; }
          test -n "$UNITY_UBA_ORG_ID" || { echo 'Missing UNITY_UBA_ORG_ID repository secret'; exit 1; }
          test -n "$UNITY_UBA_PROJECT_ID" || { echo 'Missing UNITY_UBA_PROJECT_ID repository secret'; exit 1; }

      - name: Resolve Unity build target ID
        id: unity-target
        shell: bash
        env:
          TARGET_NAME: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > buildtargets.json

          TARGET_ID="$(jq -r --arg name "$TARGET_NAME" '
            def rows:
              if type == "array" then .
              elif (.buildtargets? | type) == "array" then .buildtargets
              elif (.buildTargets? | type) == "array" then .buildTargets
              elif (.targets? | type) == "array" then .targets
              else [] end;
            rows
            | map(select((.name // .targetName // .buildTargetName // .displayName // "") == $name))
            | .[0]
            | (.buildtargetid // .buildTargetId // .id // .name // empty)
          ' buildtargets.json)"

          if [ -z "$TARGET_ID" ] || [ "$TARGET_ID" = "null" ]; then
            echo "Could not find Unity Build Automation target named '$TARGET_NAME'." >&2
            jq -r 'if type == "array" then . else (.buildtargets // .buildTargets // .targets // []) end | .[] | (.name // .targetName // .buildTargetName // .displayName // "<unnamed>")' buildtargets.json >&2 || true
            exit 1
          fi
          echo "id=$TARGET_ID" >> "$GITHUB_OUTPUT"

      - name: Start Unity cloud build
        id: start
        shell: bash
        env:
          TARGET_ID: ${{ steps.unity-target.outputs.id }}
          TARGET_NAME: ${{ steps.target.outputs.name }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds"
          BODY="$(jq -nc --arg branch "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '{clean:false,branch:$branch,commit:$commit}')"
          HTTP="$(curl --silent --show-error \
            -o build-start.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: $UNITY_UBA_AUTH" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "$URL")"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Unity Build Automation returned HTTP $HTTP" >&2
            cat build-start.json >&2 || true
            exit 1
          fi
          echo "Started $TARGET_NAME (HTTP $HTTP)."
          {
            echo "### Unity Build Automation"
            echo "Started **$TARGET_NAME** from branch \`$GITHUB_REF_NAME\`."
            echo "Requested commit: \`$GITHUB_SHA\`."
            echo "Unity API response: HTTP $HTTP."
          } >> "$GITHUB_STEP_SUMMARY"
