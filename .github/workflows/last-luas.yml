name: Last Luas Real Characters Validate

on:
  pull_request:
    paths:
      - 'public/games/last-luas/**'
      - 'tests/last-luas.test.mjs'
      - '.github/workflows/last-luas.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Last Luas source tests
        run: node --test tests/last-luas.test.mjs
      - name: Render real-character smoke views
        run: |
          set -euo pipefail
          mkdir -p /tmp/last-luas-real-characters
          python3 -m http.server 4173 --directory public >/tmp/last-luas-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/games/last-luas/ >/dev/null; then break; fi
            sleep 0.25
          done

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';

          const browser = await chromium.launch({headless:true});
          const cases = [
            {name:'player', url:'?smoke=1&distance=18', viewport:{width:1280,height:720}},
            {name:'tourist', url:'?smoke=1&focus=tourist', viewport:{width:1280,height:720}},
            {name:'cyclist', url:'?smoke=1&focus=cyclist', viewport:{width:1280,height:720}},
            {name:'umbrella', url:'?smoke=1&focus=umbrella', viewport:{width:1280,height:720}},
            {name:'delivery', url:'?smoke=1&focus=delivery', viewport:{width:1280,height:720}},
            {name:'mobile-umbrella', url:'?smoke=1&focus=umbrella', viewport:{width:844,height:390}}
          ];
          const report=[];
          for (const item of cases) {
            const page=await browser.newPage({viewport:item.viewport});
            const consoleMessages=[];
            const pageErrors=[];
            page.on('console',m=>consoleMessages.push(m.type()+': '+m.text()));
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/games/last-luas/'+item.url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.lastLuasReady === '1', null, {timeout:30000});
            await page.waitForFunction(() => document.documentElement.dataset.lastLuasSmokeStopped === '1', null, {timeout:10000});
            const dataset=await page.evaluate(()=>({...document.documentElement.dataset}));
            if(dataset.lastLuasBuild!=='0.4.0')throw new Error(item.name+': wrong build '+dataset.lastLuasBuild);
            if(dataset.lastLuasCharacterAssets!=='2')throw new Error(item.name+': character assets not loaded');
            if(dataset.lastLuasAssetError==='1')throw new Error(item.name+': asset load error');
            if(item.name!=='player'&&!item.name.startsWith('mobile-')&&dataset.lastLuasReviewFocus!==item.name){
              throw new Error(item.name+': review focus not active');
            }
            await page.screenshot({path:'/tmp/last-luas-real-characters/'+item.name+'.png',fullPage:true});
            report.push({name:item.name,viewport:item.viewport,dataset,consoleMessages,pageErrors});
            if(pageErrors.length)throw new Error(item.name+': '+pageErrors.join(' | '));
            await page.close();
          }
          await browser.close();
          writeFileSync('/tmp/last-luas-real-characters/report.json',JSON.stringify(report,null,2));
          NODE

          test -s /tmp/last-luas-real-characters/player.png
          test -s /tmp/last-luas-real-characters/tourist.png
          test -s /tmp/last-luas-real-characters/cyclist.png
          test -s /tmp/last-luas-real-characters/umbrella.png
          test -s /tmp/last-luas-real-characters/delivery.png
          test -s /tmp/last-luas-real-characters/mobile-umbrella.png

      - name: Full repository tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-luas-real-character-smoke
          path: /tmp/last-luas-real-characters/
          if-no-files-found: warn
          retention-days: 7
