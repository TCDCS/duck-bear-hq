name: Last Luas Real Characters Validate

on:
  pull_request:
    paths:
      - 'public/games/last-luas/**'
      - 'tests/last-luas.test.mjs'
      - '.github/workflows/last-luas.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Last Luas source tests
        run: node --test tests/last-luas.test.mjs
      - name: Render real-character smoke views
        run: |
          set -euo pipefail
          mkdir -p /tmp/last-luas-real-characters
          python3 -m http.server 4173 --directory public >/tmp/last-luas-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/games/last-luas/ >/dev/null; then break; fi
            sleep 0.25
          done
          python scripts/last-luas-visual.py

      - name: Full repository tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-luas-real-character-smoke
          path: /tmp/last-luas-real-characters/
          if-no-files-found: warn
          retention-days: 7
