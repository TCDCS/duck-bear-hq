name: Last Luas Real Characters Validate

on:
  pull_request:
    paths:
      - 'public/games/last-luas/**'
      - 'tests/last-luas.test.mjs'
      - '.github/workflows/last-luas.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Last Luas source tests
        run: node --test tests/last-luas.test.mjs
      - name: Render real-character smoke views
        run: |
          set -euo pipefail
          mkdir -p /tmp/last-luas-real-characters
          python3 -m http.server 4173 --directory public >/tmp/last-luas-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/games/last-luas/ >/dev/null; then break; fi
            sleep 0.25
          done

          shot () {
            name="$1"
            distance="$2"
            size="$3"
            target="/tmp/last-luas-real-characters/$name.png"
            timeout 30s google-chrome --headless --no-sandbox --hide-scrollbars --window-size="$size" --virtual-time-budget=8000 --run-all-compositor-stages-before-draw --screenshot="$target" "http://127.0.0.1:4173/games/last-luas/?smoke=1&distance=$distance" || test -s "$target"
            test -s "$target"
          }
          shot player 12 1280,720
          shot tourist 60 1280,720
          shot cyclist 72 1280,720
          shot umbrella 102 1280,720
          shot delivery 148 1280,720
          shot mobile-umbrella 102 844,390

      - name: Full repository tests
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-luas-real-character-smoke
          path: /tmp/last-luas-real-characters/
          if-no-files-found: warn
          retention-days: 7
