name: Family private import
on:
  push:
    branches: [codex/family-private-delivery-20261003]
    paths: ['.family-private-start']
permissions:
  contents: read
concurrency:
  group: family-private-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/family-private-delivery-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create ephemeral receiving key
        run: |
          umask 077
          mkdir -p /tmp/family-receiver/public
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/family-receiver/private.pem 2>/dev/null
          openssl pkey -in /tmp/family-receiver/private.pem -pubout -out /tmp/family-receiver/public/receiver-public.pem 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: family-receiver-public-${{ github.run_id }}
          path: /tmp/family-receiver/public/
          retention-days: 1
      - name: Receive encrypted package for this run only
        run: |
          for i in $(seq 1 72); do
            git fetch -q origin codex/family-private-delivery-20261003
            if git show origin/codex/family-private-delivery-20261003:.family-private-delivery.json > /tmp/family-receiver/delivery.json 2>/dev/null && node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/family-receiver/delivery.json"));process.exit(String(d.runId)===process.env.GITHUB_RUN_ID?0:1)'; then
              break
            fi
            sleep 5
          done
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const d=JSON.parse(await readFile('/tmp/family-receiver/delivery.json','utf8'));
          if(String(d.runId)!==process.env.GITHUB_RUN_ID)throw Error('No encrypted delivery for this run.');
          const r=await fetch(d.url,{signal:AbortSignal.timeout(45000)});
          if(!r.ok)throw Error('Encrypted delivery unavailable.');
          const b=Buffer.from(await r.arrayBuffer());
          if(b.length>3000000||createHash('sha256').update(b).digest('hex')!==d.sha256)throw Error('Encrypted delivery verification failed.');
          await writeFile('/tmp/family-receiver/payload.enc.json',b,{mode:0o600});
          NODE
      - name: Preview and back up private records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAMILY_IMPORT_PHASE: preview
          FAMILY_D1_ID: 05f3e993-e41a-4d0e-8166-bcd04ae235f9
          FAMILY_ENVELOPE: /tmp/family-receiver/payload.enc.json
          FAMILY_PRIVATE_KEY: /tmp/family-receiver/private.pem
        run: node scripts/family-private-import.mjs
      - name: Encrypted preflight report
        uses: actions/upload-artifact@v4
        with:
          name: family-private-preview-${{ github.run_id }}
          path: family-delivery-result.enc.json
          retention-days: 1
      - name: Require the reviewed preview signature
        run: |
          for i in $(seq 1 72); do
            git fetch -q origin codex/family-private-delivery-20261003
            if git show origin/codex/family-private-delivery-20261003:.family-private-approve.json > /tmp/family-receiver/approval.json 2>/dev/null && node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/family-receiver/approval.json"));process.exit(String(d.runId)===process.env.GITHUB_RUN_ID?0:1)'; then
              break
            fi
            sleep 5
          done
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          const a=JSON.parse(await readFile('/tmp/family-receiver/approval.json','utf8'));
          if(String(a.runId)!==process.env.GITHUB_RUN_ID||!/^[A-Za-z0-9_-]{43}$/.test(a.signature))throw Error('No reviewed preview approval for this run.');
          await appendFile(process.env.GITHUB_ENV,'FAMILY_EXPECTED_SIGNATURE='+a.signature+'\n');
          NODE
      - name: Apply the reviewed import and check repeat import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAMILY_D1_ID: 05f3e993-e41a-4d0e-8166-bcd04ae235f9
          FAMILY_ENVELOPE: /tmp/family-receiver/payload.enc.json
          FAMILY_PRIVATE_KEY: /tmp/family-receiver/private.pem
        run: node scripts/family-private-import.mjs
      - name: Encrypted verification and recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-private-result-${{ github.run_id }}
          path: family-delivery-result.enc.json
          retention-days: 1
      - name: Remove ephemeral receiving key and encrypted delivery
        if: always()
        run: rm -rf /tmp/family-receiver
