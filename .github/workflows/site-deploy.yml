name: Site Deploy
# Deploy checked main; verify the private Last Luas release on the actual custom domain.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: duck-bear-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Repository checks
        run: npm run check
      - name: Require Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Cloudflare deployment cannot run until both repository secrets are configured."
            exit 1
          fi
      - name: Confirm private Last Luas owner binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/last-luas-private-assets.py configure
      - name: Deploy current main to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Install private browser acceptance tools
        run: |
          python -m pip install --quiet playwright cryptography
          python -m playwright install --with-deps chromium
      - name: Verify the deployed private game and remove acceptance session
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/last-luas-live-smoke.py
      - name: Encrypt live browser evidence
        if: always()
        run: python scripts/last-luas-seal.py /tmp/last-luas-live-browser /tmp/last-luas-live.encrypted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-luas-live-browser-encrypted
          path: /tmp/last-luas-live.encrypted.json
          retention-days: 1
