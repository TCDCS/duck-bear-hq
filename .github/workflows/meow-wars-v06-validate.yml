name: Meow Wars v1.6 Validate

on:
  pull_request:
    paths:
      - 'public/games/meow-wars/**'
      - 'public/games/index.html'
      - 'tests/meow-wars-v16.test.mjs'
      - 'tests/meow-wars-online.test.mjs'
      - 'scripts/meow-wars-v16-visual.mjs'
      - 'scripts/meow-wars-v16-online-e2e.mjs'
      - '.github/workflows/meow-wars-v06-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository dependencies
        run: npm ci
      - name: Run full repository test suite
        run: npm test
      - name: Compile Worker and Durable Object bindings
        run: npx wrangler deploy --dry-run --outdir /tmp/meow-worker-dryrun

  visual:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare current production source for before screenshots
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/meow-main FETCH_HEAD
      - name: Start branch and main static servers
        run: |
          python3 -m http.server 4173 --directory public > /tmp/meow-v16-server.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/meow-main/public > /tmp/meow-main-server.log 2>&1 &
          sleep 2
      - name: Capture current production state
        env:
          MEOW_WARS_URL: http://127.0.0.1:4174/games/meow-wars/
          MEOW_WARS_VARIANT: before
          MEOW_WARS_ARENAS: 7
        run: node scripts/meow-wars-v16-visual.mjs
      - name: Capture and exercise v1.6 branch
        env:
          MEOW_WARS_URL: http://127.0.0.1:4173/games/meow-wars/
          MEOW_WARS_VARIANT: after
          MEOW_WARS_ARENAS: 7
          MEOW_WARS_BUILD: mw-v16-menu-city-life-20260918a
        run: node scripts/meow-wars-v16-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meow-wars-v16-before-after
          path: artifacts/meow-wars-v16/
          if-no-files-found: warn
          retention-days: 7

  online:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker and browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start real local Cloudflare Worker
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/meow-v16-wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/meow-wars/version > /tmp/meow-version.json; then
              cat /tmp/meow-version.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/meow-v16-wrangler.log
          exit 1
      - name: Preserve two-browser online/mobile/reconnect contract
        env:
          MEOW_WARS_URL: http://127.0.0.1:8787/games/meow-wars/
        run: node scripts/meow-wars-v16-online-e2e.mjs
      - name: Print Worker log on failure
        if: failure()
        run: tail -n 300 /tmp/meow-v16-wrangler.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meow-wars-v16-online-proof
          path: artifacts/meow-wars-v16-online/
          if-no-files-found: warn
          retention-days: 7
