name: Meow Wars v1.0 Validate

on:
  pull_request:
    paths:
      - 'public/games/meow-wars/**'
      - 'public/games/index.html'
      - 'tests/meow-wars-v10.test.mjs'
      - 'scripts/meow-wars-v10-visual.mjs'
      - '.github/workflows/meow-wars-v06-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production payload and v1.0 layers
        run: node --test tests/meow-wars-v10.test.mjs tests/danao-release-upload.test.mjs

  visual:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prepare current live source for before screenshots
        run: |
          git fetch origin main --depth=1
          git worktree add /tmp/meow-main FETCH_HEAD
      - name: Start branch and main static servers
        run: |
          python3 -m http.server 4173 --directory public > /tmp/meow-v10-server.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/meow-main/public > /tmp/meow-main-server.log 2>&1 &
          sleep 2
      - name: Capture current production state
        env:
          MEOW_WARS_URL: http://127.0.0.1:4174/games/meow-wars/
          MEOW_WARS_VARIANT: before
          MEOW_WARS_ARENAS: 7
        run: node scripts/meow-wars-v10-visual.mjs
      - name: Capture and exercise v1.0 branch
        env:
          MEOW_WARS_URL: http://127.0.0.1:4173/games/meow-wars/
          MEOW_WARS_VARIANT: after
          MEOW_WARS_ARENAS: 7
          MEOW_WARS_BUILD: mw-v10-release-20260918a
        run: node scripts/meow-wars-v10-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meow-wars-v10-before-after
          path: artifacts/meow-wars-v10/
          if-no-files-found: warn
          retention-days: 7
