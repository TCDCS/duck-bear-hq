name: Illustrated HQ acceptance
on:
  push:
    branches: [main, fix/site-1-2-reconciled]
  pull_request:
    paths: ['src/hq/**', 'public/hq/**', 'tests/hq-*', 'tests/site-*', 'tests/helpers/hq-*', 'scripts/hq-*', 'wrangler.jsonc', '.github/workflows/hq-acceptance.yml']
permissions:
  contents: read
concurrency:
  group: hq-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/hq-worker
      - name: Actual Workers D1 and R2 acceptance
        run: |
          set -euo pipefail
          mkdir -p hq-browser-report
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --ip 127.0.0.1 --port 8790 --var SETUP_SECRET:hq-fixture-setup >/tmp/hq-workers.log 2>&1 &
          worker=$!
          trap 'kill "$worker" || true; cp /tmp/hq-workers.log hq-browser-report/workers.log' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:8790/api/hq/auth/status >/dev/null && break; sleep 1; done
          node scripts/hq-worker-smoke.mjs | tee hq-browser-report/worker-acceptance.txt
      - name: Install browser acceptance tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser acceptance with isolated test accounts
        env:
          BASE_URL: http://127.0.0.1:8789
          HQ_REPORT: hq-browser-report
        run: |
          set -euo pipefail
          node tests/helpers/hq-browser-server.mjs >/tmp/hq-fixture.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS "$BASE_URL/api/hq/auth/status" >/dev/null && break; sleep 1; done
          python tests/hq-browser.py
          python tests/site-browser.py
      - name: Save actual screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-browser-report
          path: hq-browser-report/
          retention-days: 7
