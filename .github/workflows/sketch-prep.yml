name: Domain email readiness
on:
  push:
    branches: [site/guannan-sketch-theme]
    paths: [.github/workflows/sketch-prep.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only email sending status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p report
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const get=async path=>{const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});let j={};try{j=await r.json()}catch{}return {status:r.status,j};};
          const z=await get('/zones?name=guannan.party');const zone=z.j.result?.find(x=>x.name==='guannan.party');
          const report={checkedAt:new Date().toISOString(),domain:'guannan.party',zoneReadable:!!zone};
          if(zone){for(const [name,path] of [['sending','/email/sending/subdomains'],['routing','/email/routing']]){const {status,j}=await get(`/zones/${zone.id}`+path);report[name]={status,success:!!j.success,errorCodes:(j.errors||[]).map(e=>e.code),...(name==='sending'?{domains:(Array.isArray(j.result)?j.result:[]).map(d=>({name:d.name,enabled:d.enabled,previewEnabled:d.preview_enabled}))}:{enabled:j.result?.enabled})};}}
          await writeFile('report/email-domain-status.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: email-domain-status
          path: report/
          retention-days: 2
