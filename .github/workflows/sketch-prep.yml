name: Website lettering preparation
on:
  push:
    branches: [site/guannan-sketch-theme]
    paths: [.github/workflows/sketch-prep.yml]
permissions:
  contents: read
jobs:
  lettering:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Embed licensed web lettering without runtime third-party requests
        run: |
          mkdir -p result
          node --input-type=module <<'JS'
          import {writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const endpoint='https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap';
          const headers={'User-Agent':'Mozilla/5.0 AppleWebKit/537.36 Chrome/130.0.0.0 Safari/537.36'};
          const res=await fetch(endpoint,{headers});if(!res.ok)throw Error('Lettering source unavailable');
          let css=await res.text();const sources=[];
          for(const url of [...new Set([...css.matchAll(/url\((https:\/\/fonts\.gstatic\.com\/[^)]+)\)/g)].map(m=>m[1]))]){
            const r=await fetch(url);if(!r.ok)throw Error('Lettering download failed');const b=Buffer.from(await r.arrayBuffer());if(b.length>300000)throw Error('Unexpected lettering size');
            sources.push({url,sha256:createHash('sha256').update(b).digest('hex'),bytes:b.length});
            css=css.replaceAll(url,'data:font/woff2;base64,'+b.toString('base64'));
          }
          if(!sources.length||css.includes('url(https:'))throw Error('Lettering source was not embedded');
          const licence=await (await fetch('https://raw.githubusercontent.com/google/fonts/main/ofl/kalam/OFL.txt')).text();
          if(!licence.includes('SIL OPEN FONT LICENSE'))throw Error('License missing');
          await writeFile('result/lettering.css','/* Kalam, Copyright 2014 Indian Type Foundry. SIL OFL 1.1. Full license: LETTERING-LICENSE.txt. Embedded website lettering; no third-party browser requests. */\n'+css);
          await writeFile('result/LETTERING-LICENSE.txt',licence);
          await writeFile('result/lettering-provenance.json',JSON.stringify({source:endpoint,retrievedAt:new Date().toISOString(),sources},null,2));
          console.log('Embedded licensed lettering in website stylesheet; no separate font files exported.');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: website-lettering
          path: result/
          retention-days: 2
