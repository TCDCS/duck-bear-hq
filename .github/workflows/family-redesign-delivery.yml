name: Family redesign delivery
on:
  push:
    branches: [codex/family-tree-redesign-20261003]
    paths: ['.family-redesign-delivery.json']
permissions:
  contents: write
concurrency:
  group: family-redesign-delivery
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/family-tree-redesign-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate and apply generic source delivery
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {dirname} from 'node:path';
          const delivery=JSON.parse(await readFile('.family-redesign-delivery.json','utf8'));
          const response=await fetch(delivery.url,{signal:AbortSignal.timeout(45000)});
          if(!response.ok)throw Error('Source delivery unavailable.');
          const bytes=Buffer.from(await response.arrayBuffer());
          const hash=b=>createHash('sha256').update(b).digest('hex');
          if(hash(bytes)!==delivery.sha256)throw Error('Source integrity check failed.');
          const patch=JSON.parse(gunzipSync(bytes));
          for(const f of patch.files){
            if(!/^(public\/hq|tests|scripts|docs)\/[\w./-]+$/.test(f.path)||f.path.includes('..'))throw Error('Unexpected source path');
            let old=null;try{old=await readFile(f.path);}catch{}
            if((old?hash(old):null)!==f.before)throw Error('Source changed from the reviewed baseline: '+f.path);
          }
          for(const f of patch.files){await mkdir(dirname(f.path),{recursive:true});await writeFile(f.path,f.content);}
          await writeFile('/tmp/family-source-paths',patch.files.map(f=>f.path).join('\n')+'\n');
          console.log('Verified source files:',patch.files.length);
          NODE
      - run: npm ci
      - name: Full unit regression
        run: npm test
      - name: Build and source checks
        run: npm run check
      - name: Browser dependencies
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Real family browser acceptance
        run: |
          node tests/helpers/family-browser-server.mjs >/tmp/family-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true; cp /tmp/family-server.log family-acceptance/server.log' EXIT
          mkdir -p family-acceptance
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8793/hq/family.mjs >/dev/null && break; sleep 1; done
          timeout 240 python tests/family-browser.py
      - name: Synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-redesign-browser
          path: family-acceptance/
          retention-days: 3
      - name: Commit verified source only
        run: |
          git config user.name 'Duck Bear Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          while IFS= read -r path; do git add -- "$path"; done < /tmp/family-source-paths
          git rm .family-redesign-delivery.json
          git commit -m 'feat: focused genealogy tree, family-only timelines and locations'
          git push origin HEAD:codex/family-tree-redesign-20261003
