name: Family books source snapshot
on:
  push:
    branches: [codex/family-books-details-20261003]
    paths: ['.github/workflows/family-books-source.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0ed8e060e61a1e155f2979f45ff68a499f0a5bef
      - run: git archive --format=tar.gz -o /tmp/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: family-books-source
          path: /tmp/source.tar.gz
          retention-days: 1
