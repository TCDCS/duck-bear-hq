name: Mango Mayhem acceptance
on:
  push:
    branches: [main]
    paths: ['public/games/**', 'public/mango-games.js', 'public/index.html', 'public/account.html', 'src/mango/**', 'src/index.js', 'src/worker-games.js', 'migrations/**', 'tests/mango-*', 'tests/helpers/mango-*', 'scripts/mango-*', '.github/workflows/mango-game.yml']
  pull_request:
    paths: ['public/games/**', 'public/mango-games.js', 'public/index.html', 'public/account.html', 'src/mango/**', 'src/index.js', 'src/worker-games.js', 'migrations/**', 'tests/mango-*', 'tests/helpers/mango-*', 'scripts/mango-*', '.github/workflows/mango-game.yml']
permissions:
  contents: read
concurrency:
  group: mango-${{ github.ref }}
  cancel-in-progress: true
jobs:
  six-world-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: All game and account unit checks
        run: |
          npm ci
          npm test
          npm run check
          npm run mango:check
          npx wrangler deploy --dry-run --outdir /tmp/mango-dry
      - name: Native browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Migrated local Worker
        run: |
          npm run migrate:local
          npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/mango-worker.log 2>&1 &
          python scripts/mango-wait.py http://127.0.0.1:8787
      - name: Full campaign, real input and cloud profiles
        env:
          BASE_URL: http://127.0.0.1:8787
          MANGO_REPORT_DIR: verification/mango/local
        run: |
          python tests/mango-browser.py
          python tests/mango-cloud-browser.py
      - name: Verify the published assets, routes and save schema
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
          MANGO_REPORT_DIR: verification/mango/live
        run: python scripts/mango-live-check.py
      - name: Play the published game through a real browser
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
          MANGO_REPORT_DIR: verification/mango/live
        run: python tests/mango-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mango-verification
          path: verification/mango
          retention-days: 14
