name: Stage reviewed Books source
on:
  push:
    branches: [feature/books-reader-2026-10-03]
    paths: ['.github/workflows/books-reviewed-source.yml']
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/feature/books-reader-2026-10-03'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact locally reviewed files
        run: |
          mkdir -p candidate
          python - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          data=lzma.decompress(base64.b64decode(''.join(pathlib.Path(f'tools/books/stage-delta-{i}.txt').read_text().strip() for i in range(3)),validate=True))
          assert hashlib.sha256(data).hexdigest()=='95bab6eb21b096172065e5066306ac56c990ea28f485f9eabee8bc46b26f597c'
          rows=json.loads(data); assert len(rows)==28
          def blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for row in rows:
              name=row['path']; path=pathlib.Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert name in ['.github/workflows/books-reader.yml','package.json','package-lock.json','docs/books-operations.md','docs/superpowers/plans/2026-10-04-books-release-readiness.md','tests/books.test.mjs'] or name.startswith(('src/books/','public/books/','tests/books/','tools/books/'))
              old=path.read_bytes() if path.exists() else b''
              assert (blob(old) if path.exists() else None)==row['before'],name
              text=old.decode('utf-8'); last=len(text)
              for start,end,insert in reversed(row['edits']):
                  assert 0<=start<=end<=last and isinstance(insert,str),name
                  text=text[:start]+insert+text[end:];last=start
              result=text.encode('utf-8');assert blob(result)==row['after'],name
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(result)
          pathlib.Path('candidate/source-manifest.json').write_text(json.dumps([{k:r[k] for k in ['path','before','after']} for r in rows],indent=2))
          print('Restored 28 checksum-verified source files; no production references changed.')
          PY
      - run: npm ci
      - name: Audit, test and compile exact source
        run: |
          set -o pipefail
          npm audit --json > candidate/dependency-audit.json
          npm test 2>&1 | tee candidate/unit-tests.log
          npm run check 2>&1 | tee candidate/repository-checks.log
          npx wrangler deploy --dry-run --outdir /tmp/books-build 2>&1 | tee candidate/worker-build.log
      - name: Create unreferenced Git objects only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='TCDCS/duck-bear-hq'
          assert os.environ['GITHUB_REF']=='refs/heads/feature/books-reader-2026-10-03'
          repo='https://api.github.com/repos/TCDCS/duck-bear-hq'
          def api(endpoint,payload):
              req=urllib.request.Request(repo+endpoint,json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          rows=json.loads(pathlib.Path('candidate/source-manifest.json').read_text()); elements=[]
          for row in rows:
              raw=pathlib.Path(row['path']).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==row['after'],row['path']
              b=api('/git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})
              assert b['sha']==row['after']
              elements.append({'path':row['path'],'type':'blob','mode':'100644','sha':b['sha']})
          for name in ['.github/workflows/books-reviewed-source.yml']+[f'tools/books/stage-delta-{i}.txt' for i in range(3)]:elements.append({'path':name,'type':'blob','mode':'100644','sha':None})
          base=subprocess.check_output(['git','show','-s','--format=%T','HEAD'],text=True).strip()
          tree=api('/git/trees',{'base_tree':base,'tree':elements})
          commit=api('/git/commits',{'message':'feat: Books 0.2.0 private recovery and verified Google connection diagnostics\n\nChecksum-verified source delivery. Add owner-only Books ZIP backup, staged checksum-verified atomic restore and same-household identity checks. Fix Google refresh/disconnect/callback races and distinguish retryable provider failures. Add Chromium/WebKit verification and pin the audited Undici patch. Candidate unit tests, audit, repository checks and Worker dry run passed. No production deployment, reference updates or private ebook data.','tree':tree['sha'],'parents':[os.environ['GITHUB_SHA']]})
          pathlib.Path('candidate/staged-commit.json').write_text(json.dumps({'parent':os.environ['GITHUB_SHA'],'commit':commit['sha'],'tree':tree['sha'],'sourceFiles':len(rows),'referencesChanged':False},indent=2))
          print('Git objects staged. Branch reference is unchanged; immutable-head browser verification must follow explicit fast-forward.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: books-reviewed-source
          path: candidate/
          retention-days: 3
