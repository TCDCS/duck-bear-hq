name: Family live source verification
on:
  push:
    branches: [codex/family-private-delivery-20261003]
    paths: ['.github/workflows/family-live-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8ce723dbe7712431c1bd22d879ccdad2f71cba0f
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify released family source and anonymous privacy boundaries
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {setTimeout as sleep} from 'node:timers/promises';
          const origin='https://guannan.party',report={commit:'8ce723dbe7712431c1bd22d879ccdad2f71cba0f',ok:false,checks:[]};
          const hash=b=>createHash('sha256').update(b).digest('hex');
          try{
            for(const path of ['/hq/family.mjs','/hq/family-model.mjs','/hq/family-genealogy.mjs','/hq/family-tree.mjs','/hq/family.css','/hq/forms.mjs','/hq/family-book.mjs','/hq/family-book-model.mjs','/hq/routes.mjs','/hq/lazy-views.mjs']){
              const expected=hash(await readFile('public'+path));let matches=false;
              for(let attempt=0;attempt<18;attempt++){
                const r=await fetch(origin+path+'?release=2026.10.03-complete-family.1&probe='+attempt,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
                matches=r.status===200&&hash(Buffer.from(await r.arrayBuffer()))===expected;
                if(matches)break;if(attempt<17)await sleep(5000);
              }
              assert.ok(matches,path+' released source');report.checks.push(path+' source hash matches');
            }
            const shellHash=hash(await readFile('public/hq/index.html'));
            for(const path of ['/family-tree/tree/','/family-tree/export/','/family-tree/map/','/family-tree/timeline/','/family-tree/import/']){
              const r=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(20000)});assert.equal(r.status,200,path);assert.equal(hash(Buffer.from(await r.arrayBuffer())),shellHash,path+' static shell only');report.checks.push(path+' serves only the data-free application shell');
            }
            for(const path of ['/api/hq/me','/api/hq/records?kind=person','/api/hq/records?kind=familyPrivate','/api/hq/family/book?mode=child','/api/hq/family/book?mode=reference&private=1&faith=1']){
              const r=await fetch(origin+path,{signal:AbortSignal.timeout(20000)});assert.equal(r.status,401,path);report.checks.push(path+' rejects anonymous read');
            }
            for(const action of ['preview','apply']){
              const path='/api/hq/family/import/'+action;const r=await fetch(origin+path,{method:'POST',headers:{origin,'content-type':'application/json'},body:'{}',signal:AbortSignal.timeout(20000)});assert.equal(r.status,401,path);report.checks.push(path+' rejects anonymous write');
            }
            report.ok=true;
          }finally{report.checkedAt=new Date().toISOString();await writeFile('family-live-verification.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-live-verification
          path: family-live-verification.json
          retention-days: 7
