name: Account implementation acceptance
on:
  push:
    branches: [feature/account-controls-passkeys]
    paths: [.github/workflows/account-prep.yml]
permissions:
  contents: write
concurrency:
  group: account-implementation-assembly
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble checksummed account changes
        run: |
          python - <<'PY'
          import pathlib,base64,gzip,hashlib,json,shutil
          root=pathlib.Path.cwd()
          chunks=[(root/f'.github/account-transfer/part-{n}.b64').read_text().strip() for n in range(1,5)]
          for n,c in enumerate(chunks,1): print('chunk',n,len(c),hashlib.sha256(c.encode()).hexdigest())
          raw=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='221308eedd9090c285b0924c937c25ae8d98504e0a365796d01e9e3fde31b03d','Source transfer checksum mismatch'
          m=json.loads(gzip.decompress(raw))
          assert m['base_sha']=='9966dab762826909a00026bab988efbb9a357332'
          for name,c in m['files'].items():
            p=root/name
            assert p.resolve().is_relative_to(root) and not name.startswith('.github/workflows/')
            old=p.read_bytes() if p.exists() else b''
            assert hashlib.sha256(old).hexdigest()==c['old_sha256'],name
            text=old.decode()
            for a,b,replacement in reversed(c['edits']):text=text[:a]+replacement+text[b:]
            result=text.encode()
            assert hashlib.sha256(result).hexdigest()==c['new_sha256'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          shutil.rmtree(root/'.github/account-transfer')
          print('Assembled verified account source; no live accounts or secrets accessed.')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir /tmp/account-worker
      - name: Install native browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real Workers account and passkey browser acceptance
        env:
          ACCOUNT_BASE: http://localhost:8790
          HQ_REPORT: account-browser-report
        run: |
          set -euo pipefail
          mkdir -p account-browser-report
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --ip 127.0.0.1 --port 8790 --var SETUP_SECRET:hq-fixture-setup --var SITE_ORIGIN:http://localhost:8790 >/tmp/account-worker.log 2>&1 &
          worker=$!
          trap 'kill "$worker" || true; cp /tmp/account-worker.log account-browser-report/worker.log' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://localhost:8790/api/hq/auth/status >/dev/null && break; sleep 1; done
          node scripts/hq-worker-smoke.mjs | tee account-browser-report/worker-smoke.txt
          node scripts/account-worker-smoke.mjs | tee account-browser-report/passkey-smoke.txt
          python tests/account-browser.py
      - name: Existing desktop and mobile site regression
        env:
          BASE_URL: http://127.0.0.1:8789
          HQ_REPORT: account-browser-report
        run: |
          set -euo pipefail
          node tests/helpers/hq-browser-server.mjs >/tmp/hq-fixture.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS "$BASE_URL/api/hq/auth/status" >/dev/null && break; sleep 1; done
          python tests/hq-browser.py
          python tests/site-browser.py
      - name: Commit only tested account source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public/hq public/index.html public/sw.js tests scripts docs package.json package-lock.json .github/account-transfer
          git diff --cached --quiet -- public/games
          git commit -m 'Add owner account controls and verified passkey sign-in 7.2.0'
          git push origin HEAD:feature/account-controls-passkeys
      - name: Save synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-browser-report
          path: account-browser-report/
          retention-days: 7
