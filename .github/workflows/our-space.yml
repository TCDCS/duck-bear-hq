name: Our Space acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/our-space-7, main]
    paths: ['src/portal/**', 'public/portal/**', 'tests/portal*', 'tests/helpers/portal*', 'src/worker-games.js', 'wrangler.jsonc', '.github/workflows/our-space.yml']
  pull_request:
    paths: ['src/portal/**', 'public/portal/**', 'tests/portal*', 'tests/helpers/portal*', 'src/worker-games.js', 'wrangler.jsonc', '.github/workflows/our-space.yml']
permissions:
  contents: read
concurrency:
  group: our-space-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Unit and repository regression checks
        run: |
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir /tmp/portal-dry
      - name: Install browser test tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Disposable local Worker and browser acceptance
        env:
          PORTAL_BASE: http://127.0.0.1:8787
          PORTAL_REPORT: portal-test-report
        run: |
          node --input-type=module -e 'import fs from "node:fs";const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));c.vars={...c.vars,SETUP_SECRET:"portal-local-fixture",SITE_ORIGIN:"http://127.0.0.1:8787"};fs.writeFileSync("wrangler.portal-test.json",JSON.stringify(c));'
          npx wrangler d1 migrations apply DB --local --config wrangler.portal-test.json --persist-to /tmp/portal-local-state
          npx wrangler dev --config wrangler.portal-test.json --ip 127.0.0.1 --port 8787 --persist-to /tmp/portal-local-state > portal-worker-test.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f wrangler.portal-test.json' EXIT
          python tests/portal-browser.py
      - name: Save fixture-only screenshots and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: our-space-acceptance
          path: |
            portal-test-report/*.png
            portal-test-report/report.json
            portal-worker-test.log
          retention-days: 7
