name: Wacky Races regression and live checks
on:
  push:
    branches: [main]
    paths: ['src/**','public/**','tests/**','scripts/**','package.json','package-lock.json','wrangler.jsonc','.github/workflows/wacky-races.yml']
  pull_request:
    paths: ['src/**','public/**','tests/**','scripts/**','package.json','package-lock.json','wrangler.jsonc','.github/workflows/wacky-races.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: wacky-races-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest-and-multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          npm ci --no-audit --no-fund
          python -m pip install playwright aiohttp
          python -m playwright install --with-deps chromium
      - name: Check source, privacy and Worker bundle
        run: |
          mkdir -p verification/local
          npm test | tee verification/unit-tests.tap
          npm run check
          npx wrangler deploy --dry-run --outdir /tmp/wacky-build
          npx wrangler d1 migrations apply DB --local
      - name: Race native browser clients and seven separate drivers locally
        env:
          BASE_URL: http://127.0.0.1:8787
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > verification/local/wrangler.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/api/races/version && break; sleep 1; done
          python tests/setup-browser.py
          cp verification/setup-browser.json verification/local/setup-browser.json
          python tests/live-room-smoke.py
          mv verification/seven-player-live.json verification/local/seven-player.json
          python tests/browser_clients.py
          cp verification/browser-clients.json verification/local/browser-clients.json
      - name: Wait for this source to be published by Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
        run: python scripts/wait-live.py
      - name: Check seven guest drivers on the published server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
        run: python tests/live-room-smoke.py
      - name: Complete a race through the published website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
        run: |
          python tests/setup-browser.py
          python tests/browser_clients.py
      - name: Save verification report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wacky-races-verification
          path: verification/
          retention-days: 7
