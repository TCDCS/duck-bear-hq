name: Seagull Simulator Validate

on:
  push:
    branches:
      - feature/seagull-simulator
  pull_request:
    paths:
      - 'src/seagull-simulator/**'
      - 'public/games/seagull-simulator/**'
      - 'public/games/index.html'
      - 'public/games/games.css'
      - 'public/index.html'
      - 'public/seagull-card.css'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check.mjs'
      - '.github/workflows/seagull-simulator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Seagull Simulator
        run: npm run build:seagull
      - name: Repository checks
        run: npm run check
      - name: Site tests
        run: npm test
      - name: Check bundle size
        run: |
          test -s public/games/seagull-simulator/game.js
          bytes=$(wc -c < public/games/seagull-simulator/game.js)
          echo "Seagull bundle: $bytes bytes"
          test "$bytes" -lt 3500000
