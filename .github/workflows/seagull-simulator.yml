name: Seagull Simulator Validate

on:
  push:
    branches:
      - feature/seagull-simulator
  pull_request:
    paths:
      - 'src/seagull-simulator/**'
      - 'public/games/seagull-simulator/**'
      - 'public/games/index.html'
      - 'public/games/games.css'
      - 'public/index.html'
      - 'public/seagull-card.css'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check.mjs'
      - '.github/workflows/seagull-simulator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Seagull Simulator
        run: npm run build:seagull
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 --directory public >/tmp/seagull-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/games/seagull-simulator/ >/dev/null && break
            sleep 0.25
          done
          google-chrome --headless --no-sandbox --hide-scrollbars --window-size=1280,720 --virtual-time-budget=3500 --screenshot=/tmp/seagull-smoke.png 'http://127.0.0.1:4173/games/seagull-simulator/?autostart=1&smoke=1'
          dom=$(google-chrome --headless --no-sandbox --dump-dom --virtual-time-budget=3500 'http://127.0.0.1:4173/games/seagull-simulator/?autostart=1&smoke=1')
          echo "$dom" | grep 'data-seagull-ready="1"'
          test -s /tmp/seagull-smoke.png
      - name: Upload smoke screenshot
        uses: actions/upload-artifact@v4
        with:
          name: seagull-simulator-smoke
          path: /tmp/seagull-smoke.png
          if-no-files-found: error
      - name: Repository checks
        run: npm run check
      - name: Site tests
        run: npm test
      - name: Check bundle size
        run: |
          test -s public/games/seagull-simulator/game.js
          bytes=$(wc -c < public/games/seagull-simulator/game.js)
          echo "Seagull bundle: $bytes bytes"
          test "$bytes" -lt 3500000
