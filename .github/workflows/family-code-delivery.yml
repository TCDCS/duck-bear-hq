name: Family code delivery
on:
  push:
    branches: [codex/family-history-20261003]
    paths: ['.family-code-delivery.json']
permissions:
  contents: write
concurrency:
  group: family-code-delivery
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/family-history-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and unpack generic source delivery
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile,mkdir} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import {dirname} from 'node:path';
          const delivery=JSON.parse(await readFile('.family-code-delivery.json','utf8'));
          const res=await fetch(delivery.url,{signal:AbortSignal.timeout(45000)});
          if(!res.ok)throw Error('Source delivery unavailable');
          const bytes=Buffer.from(await res.arrayBuffer());
          const hash=b=>createHash('sha256').update(b).digest('hex');
          if(hash(bytes)!==delivery.sha256)throw Error('Delivery hash mismatch');
          const patch=JSON.parse(gunzipSync(Buffer.from(bytes.toString().trim(),'base64')));
          for(const f of patch.files){
            if(!/^(src|public|tests|scripts|docs)\/[\w./-]+$/.test(f.path)||f.path.includes('..'))throw Error('Unsafe source path');
            let old=null;try{old=await readFile(f.path);}catch{}
            if((old?hash(old):null)!==f.before)throw Error('Source changed since the verified base: '+f.path);
          }
          for(const f of patch.files){await mkdir(dirname(f.path),{recursive:true});await writeFile(f.path,f.content);}
          console.log('Verified source files:',patch.files.length);
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Browser dependencies
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          node tests/family-browser-server.mjs > /tmp/family-browser-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8793/hq/family.mjs >/dev/null && break; sleep 1; done
          python tests/family-browser.py
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-browser-evidence
          path: family-acceptance/
          retention-days: 3
      - name: Verified source snapshot
        if: always()
        run: tar -czf /tmp/family-candidate.tar.gz src public scripts tests docs package.json package-lock.json
      - name: Preserve source for independent verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-candidate-source
          path: /tmp/family-candidate.tar.gz
          retention-days: 3
      - name: Commit tested source changes
        run: |
          git config user.name 'Duck Bear Family Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add src public scripts tests docs
          git rm .family-code-delivery.json
          git commit -m 'feat: private family history, life timelines, worldwide map and safe import'
          git push origin HEAD:codex/family-history-20261003
