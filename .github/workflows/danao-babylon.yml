name: Danao Babylon

on:
  workflow_dispatch:
  push:
    branches: [feature/danao-babylon-final]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-danao.mjs'
      - 'public/games/danao/**'
      - 'src/game-routes.js'
      - 'tests/danao-*.test.mjs'
      - 'tests/danao-babylon-browser.py'
      - 'docs/superpowers/specs/2026-09-17-danao-babylon-design.md'
      - 'docs/superpowers/plans/2026-09-17-danao-babylon.md'
      - '.github/workflows/danao-babylon.yml'

permissions:
  contents: write

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh migration lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if dependencies changed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: lock Danao Babylon dependencies"
            git push origin HEAD:feature/danao-babylon-final
          fi
      - run: npm ci --no-audit --no-fund
      - name: Build self-hosted Danao client
        run: npm run build:danao
      - name: Danao tests
        run: node --test tests/danao-*.test.mjs
      - name: Full repository tests
        run: npm test
      - name: Repository checks
        run: npm run check
      - name: Syntax checks
        run: |
          node --check public/games/danao/game.mjs
          node --check public/games/danao/catalog.mjs
          node --check public/games/danao/fighter.mjs
          node --check public/games/danao/bot.mjs
          node --check scripts/build-danao.mjs
          node --check src/game-routes.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acceptance tools
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Start local Duck and Bear Worker
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/danao-wrangler.log 2>&1 &
          echo $! > /tmp/danao-wrangler.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8787/games/danao/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/danao-wrangler.log
          exit 1
      - name: Real browser Danao acceptance
        env:
          BASE_URL: http://127.0.0.1:8787
        run: python tests/danao-babylon-browser.py
      - name: Wrangler log on failure
        if: failure()
        run: cat /tmp/danao-wrangler.log || true
      - name: Preserve Danao browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danao-babylon-browser
          path: verification/danao-babylon
          if-no-files-found: ignore
