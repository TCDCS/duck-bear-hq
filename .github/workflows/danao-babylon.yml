name: Danao Babylon

on:
  workflow_dispatch:
  push:
    branches: [feature/danao-babylon-final]
    paths:
      - 'public/games/danao/**'
      - 'src/game-routes.js'
      - 'tests/danao-*.test.mjs'
      - 'docs/superpowers/specs/2026-09-17-danao-babylon-design.md'
      - 'docs/superpowers/plans/2026-09-17-danao-babylon.md'
      - '.github/workflows/danao-babylon.yml'

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Danao tests
        run: node --test tests/danao-*.test.mjs
      - name: Full repository tests
        run: npm test
      - name: Repository checks
        run: npm run check
      - name: Syntax checks
        run: |
          node --check public/games/danao/game.mjs || true
          node --check public/games/danao/catalog.mjs || true
          node --check public/games/danao/fighter.mjs || true
          node --check public/games/danao/bot.mjs || true
          node --check src/game-routes.js
