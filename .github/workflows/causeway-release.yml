name: Assemble supplied Causeway hero
on:
  push:
    branches: [fix/supplied-causeway-hero]
    paths: [.github/workflows/causeway-release.yml]
permissions:
  contents: write
concurrency:
  group: supplied-causeway-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reconstruct exact supplied artwork and update Website 7.4.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re
          root=Path.cwd()
          transfer=root/'.github/causeway-transfer'
          parts=sorted(transfer.glob('part-*.txt'))
          assert parts, 'No Causeway transfer parts found'
          encoded=''.join(p.read_text().strip() for p in parts)
          data=base64.b64decode(encoded,validate=True)
          expected='ea49af491ceb81f7c90c87b447a84dc1ceecc628401ff86d672e803700fa06a0'
          assert len(data)==67842, (len(data),'Unexpected Causeway image size')
          assert hashlib.sha256(data).hexdigest()==expected, 'Causeway image checksum mismatch'
          hero=root/'public/hq/duck-bear-causeway.webp'
          hero.write_bytes(data)

          def read(path): return (root/path).read_text()
          def write(path,text): (root/path).write_text(text)
          def replace_once(path,old,new):
              text=read(path)
              assert text.count(old)==1, (path,old[:80],text.count(old))
              write(path,text.replace(old,new,1))

          replace_once('src/hq/core.mjs',"export const VERSION='7.4.1';","export const VERSION='7.4.2';")
          replace_once('src/hq/core.mjs',"export const BUILD='2026.09.29-menu-live.1';","export const BUILD='2026.09.29-causeway-image.1';")

          pkg=json.loads(read('package.json')); assert pkg['version']=='7.4.1'; pkg['version']='7.4.2'; write('package.json',json.dumps(pkg,indent=2)+'\n')
          lock=json.loads(read('package-lock.json')); assert lock['version']=='7.4.1' and lock['packages']['']['version']=='7.4.1'; lock['version']='7.4.2'; lock['packages']['']['version']='7.4.2'; write('package-lock.json',json.dumps(lock,indent=2)+'\n')

          version_files=[
            'public/index.html','public/hq/index.html','public/games/index.html','public/account.html',
            'public/menus/archive/index.html','public/menus/index.html','public/menus/member/index.html',
            'public/menus/archive/2026-09-28/index.html','tests/site-browser.py','tests/sketch-theme.test.mjs'
          ]
          for path in version_files:
              text=read(path)
              assert '7.4.1' in text, path
              write(path,text.replace('7.4.1','7.4.2').replace(r'7\.4\.1',r'7\.4\.2'))

          text=read('public/index.html')
          assert '/hq/sketch-world.svg?v=7.4.2' in text
          text=text.replace('rel="preload" as="image" href="/hq/sketch-world.svg?v=7.4.2" fetchpriority="high"',
                            'rel="preload" as="image" href="/hq/duck-bear-causeway.webp?v=7.4.2" type="image/webp" fetchpriority="high"')
          text=text.replace('src="/hq/sketch-world.svg?v=7.4.2" alt="A yellow duck and a friendly brown grizzly bear posing on the Giant’s Causeway" width="680" height="490"',
                            'src="/hq/duck-bear-causeway.webp?v=7.4.2" alt="A yellow duck and a friendly brown bear with a map posing on the Giant’s Causeway" width="640" height="480"')
          assert '/hq/duck-bear-causeway.webp?v=7.4.2' in text and 'friendly brown bear with a map' in text
          write('public/index.html',text)

          text=read('public/hq/views.mjs')
          old='<img src="/hq/sketch-world.svg?v=7.4.0" alt="A yellow duck and a friendly brown grizzly bear posing on the Giant’s Causeway" loading="eager" decoding="async" fetchpriority="high">'
          new='<img src="/hq/duck-bear-causeway.webp?v=7.4.2" alt="A yellow duck and a friendly brown bear with a map posing on the Giant’s Causeway" loading="eager" decoding="async" fetchpriority="high">'
          assert text.count(old)==1
          write('public/hq/views.mjs',text.replace(old,new,1))

          text=read('public/sw.js')
          assert "duck-bear-hq-v7-4-1-menu-live" in text
          text=text.replace("duck-bear-hq-v7-4-1-menu-live","duck-bear-hq-v7-4-2-causeway-image").replace('7.4.1','7.4.2')
          marker="'/hq/duck-bear.svg','/assets/icon.svg'"
          assert marker in text
          text=text.replace(marker,"'/hq/duck-bear.svg','/hq/duck-bear-causeway.webp?v=7.4.2','/assets/icon.svg'",1)
          write('public/sw.js',text)

          text=read('public/hq/settings.mjs')
          marker='<article class="panel"><h2>29 September 2026 · Faster menus & the Giant’s Causeway</h2>'
          assert marker in text
          note='<article class="panel"><h2>29 September 2026 · The correct Causeway picture</h2><p>The homepage now uses the supplied Duck & Bear Giant’s Causeway artwork: yellow duck, friendly brown bear, map, backpacks, sea and basalt columns. It is the actual website hero rather than a simplified replacement drawing.</p><h2>Earlier: Faster menus & the Giant’s Causeway</h2>'
          write('public/hq/settings.mjs',text.replace(marker,note,1))

          text=read('tests/site-menu-experience.test.mjs')
          text=text.replace('7.4.1','7.4.2').replace(r'7\.4\.1',r'7\.4\.2')
          text=text.replace("readFile(new URL('../public/hq/sketch-world.svg',import.meta.url),'utf8')",
                            "readFile(new URL('../public/hq/duck-bear-causeway.webp',import.meta.url))")
          text=text.replace("assert.match(html,/friendly brown grizzly bear posing on the Giant’s Causeway/);",
                            "assert.match(html,/friendly brown bear with a map posing on the Giant’s Causeway/);")
          text=text.replace(r'assert.match(html,/rel="preload" as="image" href="\/hq\/sketch-world\.svg\?v=7\.4\.2"/);',
                            r'assert.match(html,/rel="preload" as="image" href="\/hq\/duck-bear-causeway\.webp\?v=7\.4\.2"/);')
          old=" assert.match(art,/Giant's Causeway/);\n assert.match(art,/friendly shaggy brown grizzly bear/);"
          new=" assert.equal(art.byteLength,67842);\n const {createHash}=await import('node:crypto');\n assert.equal(createHash('sha256').update(art).digest('hex'),'ea49af491ceb81f7c90c87b447a84dc1ceecc628401ff86d672e803700fa06a0');"
          assert old in text
          text=text.replace(old,new,1)
          write('tests/site-menu-experience.test.mjs',text)

          text=read('scripts/site-live-verify.mjs')
          old=""" const home=await waitText('/',html=>html.includes('Website '+VERSION)&&html.includes('/hq/sketch.css')&&html.includes('/hq/sketch-world.svg?v='+VERSION),'Homepage did not reach Website '+VERSION+' during propagation window');
           assert.ok(home.includes('friendly brown grizzly bear posing on the Giant’s Causeway'));
           report.checks.push('Homepage reports Website '+VERSION+' and the Giant’s Causeway hero');"""
          new=""" const home=await waitText('/',html=>html.includes('Website '+VERSION)&&html.includes('/hq/sketch.css')&&html.includes('/hq/duck-bear-causeway.webp?v='+VERSION),'Homepage did not reach Website '+VERSION+' during propagation window');
           assert.ok(home.includes('friendly brown bear with a map posing on the Giant’s Causeway'));
           report.checks.push('Homepage reports Website '+VERSION+' and references the supplied Giant’s Causeway artwork');
           const heroResponse=await get(releasePath('/hq/duck-bear-causeway.webp'));assert.equal(heroResponse.status,200,'Causeway artwork');
           assert.match(heroResponse.headers.get('content-type')||'',/^image\/webp/);
           const liveHero=Buffer.from(await heroResponse.arrayBuffer()),sourceHero=await readFile('public/hq/duck-bear-causeway.webp');
           assert.equal(hash(liveHero),hash(sourceHero),'Causeway artwork hash');
           report.checks.push('Supplied Giant’s Causeway artwork matches the released file SHA-256');"""
          assert old in text
          write('scripts/site-live-verify.mjs',text.replace(old,new,1))

          assert 'heroUrl' not in read('public/home.js'), 'Old runtime homepage image override returned'
          print('Reconstructed supplied image:',len(data),expected)
          PY
      - run: npm ci
      - name: Full tests
        run: npm test
      - name: Repository and game checks
        run: npm run check
      - name: Worker dry build
        run: npx wrangler deploy --dry-run --outdir /tmp/causeway-worker
      - name: Commit only tested website source
        run: |
          set -euo pipefail
          rm -rf .github/causeway-transfer
          rm .github/workflows/causeway-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             public/hq/duck-bear-causeway.webp             public/index.html public/hq/index.html public/hq/views.mjs public/hq/settings.mjs             public/games/index.html public/account.html public/sw.js             public/menus/archive/index.html public/menus/index.html public/menus/member/index.html             public/menus/archive/2026-09-28/index.html             src/hq/core.mjs scripts/site-live-verify.mjs             tests/site-menu-experience.test.mjs tests/sketch-theme.test.mjs tests/site-browser.py             package.json package-lock.json
          git add -u .github
          test -z "$(git diff --cached --name-only -- public/games ':!public/games/index.html')"
          git commit -m "Use the supplied Giant's Causeway hero in Website 7.4.2"
          git push origin HEAD:fix/supplied-causeway-hero
