name: Family route integrity
on:
  push:
    branches: [codex/family-tree-redesign-20261003]
    paths: ['.github/workflows/family-route-integrity.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/family-tree-redesign-20261003
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore unrelated canonical link and attest exact route source
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const path='public/hq/routes.mjs',text=await readFile(path,'utf8');
          const before="['Change history','/admin/history']",after="['Change history','/admin/history/']";
          if(text.split(before).length!==2)throw Error('Unexpected route baseline');
          const result=text.replace(before,after);
          if(createHash('sha256').update(result).digest('hex')!=='66221c22608e43400cce710b74b73aa4a84cc57afcfce493a72eef04a9eec8b5')throw Error('Route source differs from reviewed local source');
          await writeFile(path,result);
          NODE
      - name: Route and genealogy regressions
        run: node --test tests/family-genealogy.test.mjs tests/family-redesign-regression.test.mjs tests/hq-routes.test.mjs
      - name: Commit exact verified source and remove temporary job
        run: |
          git diff --check
          git config user.name 'Duck Bear Maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add public/hq/routes.mjs
          git rm .github/workflows/family-route-integrity.yml
          git commit -m 'fix: preserve canonical navigation outside the family module'
          git push origin HEAD:codex/family-tree-redesign-20261003
