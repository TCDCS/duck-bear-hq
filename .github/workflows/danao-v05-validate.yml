name: Danao v0.5 Validate

on:
  push:
    branches: [release/danao-v05, 'feature/danao-*']
    paths:
      - 'public/games/danao/**'
      - 'public/games/index.html'
      - 'scripts/assemble-danao-v05.mjs'
      - 'scripts/danao-v05-gz/**'
      - 'scripts/danao-v*-*.mjs'
      - 'tests/danao-*.test.mjs'
      - 'package.json'
      - '.github/workflows/danao-v05-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Assemble exact Danao v0.5 source
        run: npm run assemble:danao
      - name: Syntax check Danao modules
        run: find public/games/danao/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full repository tests
        run: npm test
      - name: Repository checks
        run: npm run check
