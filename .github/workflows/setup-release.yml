name: Setup and standings release
on:
  push:
    branches: [update/setup-standings-seven]
    paths: ['.race-update/ready']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-checked changes
        run: python .race-update/apply.py
      - name: Install tools
        run: |
          npm ci --no-audit --no-fund
          python -m pip install playwright aiohttp
          python -m playwright install --with-deps chromium
      - name: Check all tests and build
        run: |
          mkdir -p verification
          npm test > verification/unit-tests.tap
          npm run check
          npx wrangler deploy --dry-run --outdir /tmp/wacky-setup
          npx wrangler d1 migrations apply DB --local
      - name: Verify setup, standings and real multiplayer
        env:
          BASE_URL: http://127.0.0.1:8787
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > verification/wrangler.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do curl -sf "$BASE_URL/api/races/version" && break; sleep 1; done
          python tests/setup-browser.py
          python tests/live-room-smoke.py
          python tests/browser_clients.py
      - name: Commit verified source to this branch only
        run: |
          python .race-update/stage.py
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-seven-verification
          path: verification/
          retention-days: 7
