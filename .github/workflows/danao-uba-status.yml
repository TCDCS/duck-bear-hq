name: Danao Unity Build Status

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target to monitor
        required: true
        type: choice
        options:
          - webgl
          - windows
  push:
    branches: [feature/danao-unity]
    paths:
      - 'unity/danao/cloud-build-status-trigger.json'

permissions:
  contents: read

env:
  UNITY_UBA_API: https://build-automation.services.api.unity.com/v2
  UNITY_UBA_AUTH: ${{ secrets.UNITY_UBA_AUTH }}
  UNITY_UBA_ORG_ID: ${{ secrets.UNITY_UBA_ORG_ID }}
  UNITY_UBA_PROJECT_ID: ${{ secrets.UNITY_UBA_PROJECT_ID }}

jobs:
  monitor-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        shell: bash
        env:
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          TARGET="${DISPATCH_TARGET:-}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TARGET="$(jq -r '.target // empty' unity/danao/cloud-build-status-trigger.json)"
          fi
          case "$TARGET" in
            webgl)
              TARGET_ID="danao-webgl"
              TARGET_NAME="Danao WebGL"
              ;;
            windows)
              TARGET_ID="danao-windows-x64"
              TARGET_NAME="Danao Windows x64"
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 2
              ;;
          esac
          echo "id=$TARGET_ID" >> "$GITHUB_OUTPUT"
          echo "name=$TARGET_NAME" >> "$GITHUB_OUTPUT"

      - name: Check Unity API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_UBA_AUTH" || { echo 'Missing UNITY_UBA_AUTH'; exit 1; }
          test -n "$UNITY_UBA_ORG_ID" || { echo 'Missing UNITY_UBA_ORG_ID'; exit 1; }
          test -n "$UNITY_UBA_PROJECT_ID" || { echo 'Missing UNITY_UBA_PROJECT_ID'; exit 1; }

      - name: Find latest Unity build
        id: latest
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds?limit=1"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > builds.json
          BUILD="$(jq -c '
            if type == "array" then .[0]
            elif (.builds? | type) == "array" then .builds[0]
            else . end
          ' builds.json)"
          NUMBER="$(printf '%s' "$BUILD" | jq -r '.buildNumber // .build // .number // empty')"
          STATUS="$(printf '%s' "$BUILD" | jq -r '.buildStatus // .status // empty')"
          if [ -z "$NUMBER" ]; then
            echo 'Unity returned no build number.' >&2
            cat builds.json >&2
            exit 1
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "initial_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Latest build: #$NUMBER status=${STATUS:-unknown}"

      - name: Wait for terminal build status
        id: wait
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
          BUILD_NUMBER: ${{ steps.latest.outputs.number }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds/$BUILD_NUMBER"
          STATUS=""
          for attempt in $(seq 1 90); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: $UNITY_UBA_AUTH" \
              "$URL" > build.json
            STATUS="$(jq -r '.buildStatus // .status // "unknown"' build.json | tr '[:upper:]' '[:lower:]')"
            echo "Unity build #$BUILD_NUMBER: $STATUS (poll $attempt/90)"
            case "$STATUS" in
              success|failure|canceled|unknown)
                break
                ;;
            esac
            sleep 20
          done
          case "$STATUS" in
            success|failure|canceled|unknown) ;;
            *)
              echo "Timed out waiting for Unity build #$BUILD_NUMBER (last status: $STATUS)" >&2
              exit 1
              ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "### Unity Build Automation"
            echo "Target: **${{ steps.target.outputs.name }}**"
            echo "Build: **#$BUILD_NUMBER**"
            echo "Status: **$STATUS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture artifacts on success
        if: ${{ steps.wait.outputs.status == 'success' }}
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
          BUILD_NUMBER: ${{ steps.latest.outputs.number }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds/$BUILD_NUMBER/artifacts"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > unity-artifacts.json

          download_signed_artifact() {
            HREF="$1"
            OUTPUT="$2"
            MIN_BYTES="$3"
            test -n "$HREF" || { echo "Missing Unity artifact URL for $OUTPUT" >&2; exit 1; }
            SIGNED_RESPONSE="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: $UNITY_UBA_AUTH" \
              "$HREF")"
            SIGNED_URL="$(printf '%s' "$SIGNED_RESPONSE" | jq -r 'if type == "string" then . elif .href? then .href elif .url? then .url else empty end')"
            test -n "$SIGNED_URL" || { echo "Unity did not return a signed download URL for $OUTPUT" >&2; exit 1; }
            curl --fail-with-body --location --silent --show-error "$SIGNED_URL" -o "$OUTPUT"
            SIZE="$(stat -c%s "$OUTPUT")"
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              echo "Downloaded Unity artifact $OUTPUT is too small ($SIZE bytes, expected at least $MIN_BYTES)." >&2
              exit 1
            fi
          }

          if [ "$TARGET_ID" = "danao-webgl" ]; then
            mkdir -p playable/Build
            download_webgl_file() {
              SOURCE_NAME="$1"
              OUTPUT_NAME="$2"
              MIN_BYTES="$3"
              HREF="$(jq -r --arg name "$SOURCE_NAME" '[.[] | select(.name == "All Artifacts") | .files[] | select(.filename == $name) | .href][0] // empty' unity-artifacts.json)"
              download_signed_artifact "$HREF" "playable/Build/$OUTPUT_NAME" "$MIN_BYTES"
            }
            download_webgl_file 'Danao WebGL/Build/Danao WebGL.loader.js' 'Danao.loader.js' 10000
            download_webgl_file 'Danao WebGL/Build/Danao WebGL.data' 'Danao.data' 1000000
            download_webgl_file 'Danao WebGL/Build/Danao WebGL.framework.js' 'Danao.framework.js' 100000
            download_webgl_file 'Danao WebGL/Build/Danao WebGL.wasm' 'Danao.wasm' 1000000
            ls -lh playable/Build
          elif [ "$TARGET_ID" = "danao-windows-x64" ]; then
            mkdir -p playable
            HREF="$(jq -r '[.[] | select(.primary == true) | .files[] | select(.filename == "Danao Windows x64.zip") | .href][0] // empty' unity-artifacts.json)"
            download_signed_artifact "$HREF" 'playable/Danao Windows x64.zip' 5000000
            unzip -t 'playable/Danao Windows x64.zip'
            ls -lh 'playable/Danao Windows x64.zip'
          fi

      - name: Upload playable WebGL build
        if: ${{ steps.wait.outputs.status == 'success' && steps.target.outputs.id == 'danao-webgl' }}
        uses: actions/upload-artifact@v4
        with:
          name: danao-webgl-playable-${{ steps.latest.outputs.number }}
          path: playable/Build
          if-no-files-found: error
          retention-days: 30

      - name: Upload playable Windows build
        if: ${{ steps.wait.outputs.status == 'success' && steps.target.outputs.id == 'danao-windows-x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: danao-windows-x64-playable-${{ steps.latest.outputs.number }}
          path: playable/Danao Windows x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish WebGL build to R2
        if: ${{ steps.wait.outputs.status == 'success' && steps.target.outputs.id == 'danao-webgl' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare credentials are not configured; keeping the verified GitHub artifact only."
            exit 0
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            CHANNEL="current"
          else
            CHANNEL="preview"
          fi

          npm ci
          for NAME in Danao.loader.js Danao.data Danao.framework.js Danao.wasm; do
            FILE="playable/Build/$NAME"
            test -s "$FILE"
            npx wrangler r2 object put "duck-bear-hq-media/danao/web/$CHANNEL/$NAME" --file "$FILE" --remote
          done
          {
            echo "Published WebGL build #${{ steps.latest.outputs.number }} to R2 channel **$CHANNEL**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture diagnostics on failure
        if: ${{ steps.wait.outputs.status != 'success' }}
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
          BUILD_NUMBER: ${{ steps.latest.outputs.number }}
        run: |
          set +e
          BASE="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds/$BUILD_NUMBER"
          curl --silent --show-error -H "Authorization: $UNITY_UBA_AUTH" "$BASE/failures" > unity-failures.json
          curl --location --silent --show-error -H "Authorization: $UNITY_UBA_AUTH" "$BASE/log" > unity-build.log
          echo '--- failure indicators ---'
          cat unity-failures.json
          echo '--- tail of Unity build log ---'
          tail -n 250 unity-build.log
          exit 0

      - name: Upload Unity diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: danao-unity-cloud-build-${{ steps.target.outputs.id }}-${{ steps.latest.outputs.number }}
          path: |
            build.json
            builds.json
            unity-artifacts.json
            unity-failures.json
            unity-build.log
          if-no-files-found: ignore

      - name: Fail when Unity build did not succeed
        if: ${{ steps.wait.outputs.status != 'success' }}
        shell: bash
        run: |
          echo "Unity cloud build ended with status '${{ steps.wait.outputs.status }}'." >&2
          exit 1
