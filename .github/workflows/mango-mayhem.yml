name: Mango Mayhem verification
on:
  push:
    branches: [mango-mayhem-release, main]
    paths: ['src/**','public/**','tests/**','scripts/**','migrations/**','package.json','package-lock.json','wrangler.jsonc','.github/workflows/mango-mayhem.yml']
  pull_request:
    paths: ['src/**','public/**','tests/**','scripts/**','migrations/**','package.json','wrangler.jsonc','.github/workflows/mango-mayhem.yml']
permissions:
  contents: read
concurrency:
  group: mango-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run game, account separation and native browser acceptance
        env:
          MANGO_LIVE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          set -euo pipefail
          mkdir -p verification/mango
          if [ -f scripts/mango-verify.sh ]; then
            bash scripts/mango-verify.sh
          else
            npm ci --no-audit --no-fund
            npm test | tee verification/mango/baseline.tap
            npm run check
          fi
      - name: Package game source without account data or test credentials
        if: always()
        run: |
          if [ -d public/games/mango-mayhem ]; then
            tar --exclude='__pycache__' -czf verification/mango/release-files.tar.gz public/games public/mango-card.css src/mango migrations/0003_mango_profiles.sql scripts/mango* scripts/integrate-mango.py tests/mango* tests/helpers/mango* docs/mango-mayhem-release.md
          fi
      - name: Save reports and actual browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mango-verification
          path: verification/
          retention-days: 7
