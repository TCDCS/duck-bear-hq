name: Danao Living Arenas QA

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/danao-*']
    paths:
      - 'public/games/danao/src/art/environment-reactions.js'
      - 'public/games/danao/src/art/environment-props.js'
      - 'public/games/danao/src/art/environment-wear.js'
      - 'public/games/danao/src/main.js'
      - 'public/games/danao/release.json'
      - 'tests/danao-v01010-living-arenas.test.mjs'
      - 'tests/danao-v01011-environment-props.test.mjs'
      - 'tests/danao-v01012-environment-wear.test.mjs'
      - '.github/workflows/danao-living-arenas-qa.yml'

permissions:
  contents: read

concurrency:
  group: danao-living-arenas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  living-arenas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Assemble exact Danao release
        run: npm run assemble:danao

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Danao site
        run: |
          python3 -m http.server 8080 --directory public > /tmp/danao-living-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/games/danao/release.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/danao-living-http.log
          exit 1

      - name: Capture ambient and reactive arena effects
        run: |
          mkdir -p verification/danao-living
          cat > verification/danao-living/living-runner.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const BASE = 'http://127.0.0.1:8080';
          const OUT = 'verification/danao-living';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 900 },
            serviceWorkers: 'block',
          });

          async function poll(page, label, fn, timeout = 90000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              try { if (await fn()) return; } catch {}
              await page.waitForTimeout(200);
            }
            throw new Error('Timed out waiting for ' + label);
          }

          async function capture({ arenaId, ambientMarker, detailMarker, wearMarker }) {
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            const result = { arenaId, checks: {}, pageErrors, passed: false };

            try {
              await page.goto(BASE + '/games/danao/', {
                waitUntil: 'domcontentloaded',
                timeout: 90000,
              });
              await page.locator('[data-action="play"]').waitFor({ state: 'visible', timeout: 30000 });
              await page.locator('[data-action="play"]').click();
              await page.locator('[data-arena="' + arenaId + '"]').click();
              await page.locator('[data-action="start"]').click();

              await poll(page, arenaId + ' living controller', async () => page.evaluate(() => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return Boolean(scene?.metadata?.danaoEnvironmentReactionController);
              }));

              await poll(page, arenaId + ' ambient marker', async () => page.evaluate((name) => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return (scene?.meshes || []).some((mesh) => mesh.name === name);
              }, ambientMarker));

              await poll(page, arenaId + ' detail controller', async () => page.evaluate(() => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return Boolean(scene?.metadata?.danaoEnvironmentDetailController);
              }));

              await poll(page, arenaId + ' detail marker', async () => page.evaluate((name) => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return (scene?.meshes || []).some((mesh) => mesh.name === name);
              }, detailMarker));

              await poll(page, arenaId + ' wear controller', async () => page.evaluate(() => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return Boolean(scene?.metadata?.danaoEnvironmentWearController);
              }));

              await poll(page, arenaId + ' wear marker', async () => page.evaluate((name) => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                return (scene?.meshes || []).some((mesh) => mesh.name === name);
              }, wearMarker));

              await page.waitForTimeout(1200);

              const fired = await page.evaluate(() => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                const event = {
                  type: 'prop-break',
                  x: 0,
                  y: 1,
                  z: 0,
                  seq: 41,
                };
                return {
                  ambient: scene?.metadata?.danaoEnvironmentReactionController?.onFeedback?.(event) === true,
                  detail: scene?.metadata?.danaoEnvironmentDetailController?.onFeedback?.(event) === true,
                  wear: scene?.metadata?.danaoEnvironmentWearController?.onFeedback?.(event) === true,
                };
              });
              result.checks.reactionAccepted = fired.ambient;
              result.checks.detailReactionAccepted = fired.detail;
              result.checks.wearReactionAccepted = fired.wear;
              await page.waitForTimeout(100);

              const state = await page.evaluate(({ ambientMarker: marker, detailMarker, wearMarker }) => {
                const scene = globalThis.BABYLON?.EngineStore?.LastCreatedScene;
                const meshes = scene?.meshes || [];
                return {
                  ambientCount: meshes.filter((mesh) => mesh.name === marker).length,
                  detailCount: meshes.filter((mesh) => mesh.name === detailMarker).length,
                  wearCount: meshes.filter((mesh) => mesh.name === wearMarker).length,
                  visibleWear: meshes.filter((mesh) =>
                    mesh.name === wearMarker && mesh.visibility > 0.05
                  ).length,
                  visibleDebris: meshes.filter((mesh) =>
                    mesh.name === 'danao-reactive-debris' && mesh.visibility > 0.05
                  ).length,
                  visiblePuffs: meshes.filter((mesh) =>
                    mesh.name === 'danao-reactive-puff' && mesh.visibility > 0.05
                  ).length,
                  reactionCount: Number(scene?.metadata?.danaoEnvironmentReactionCount || 0),
                  detailReactionCount: Number(scene?.metadata?.danaoEnvironmentDetailReactionCount || 0),
                  detailActive: Number(scene?.metadata?.danaoEnvironmentDetailActive || 0),
                  wearReactionCount: Number(scene?.metadata?.danaoEnvironmentWearCount || 0),
                  wearHighestState: Number(scene?.metadata?.danaoEnvironmentWearHighestState || 0),
                  wearLastType: scene?.metadata?.danaoEnvironmentWearLastType || '',
                  arenaId: scene?.metadata?.danaoEnvironmentReactionController?.arenaId || '',
                  detailArenaId: scene?.metadata?.danaoEnvironmentDetailController?.arenaId || '',
                  wearArenaId: scene?.metadata?.danaoEnvironmentWearController?.arenaId || '',
                };
              }, { ambientMarker, detailMarker, wearMarker });

              result.state = state;
              result.checks.correctArenaController = state.arenaId === arenaId;
              result.checks.correctDetailController = state.detailArenaId === arenaId;
              result.checks.correctWearController = state.wearArenaId === arenaId;
              result.checks.ambientAlive = state.ambientCount > 0;
              result.checks.detailAlive = state.detailCount > 0;
              result.checks.wearTargetsAlive = state.wearCount > 0;
              result.checks.wearVisible = state.visibleWear > 0;
              result.checks.debrisVisible = state.visibleDebris > 0;
              result.checks.puffVisible = state.visiblePuffs > 0;
              result.checks.reactionLogged = state.reactionCount >= 1;
              result.checks.detailReactionLogged = state.detailReactionCount >= 1;
              result.checks.detailMeshActivated = state.detailActive >= 1;
              result.checks.wearReactionLogged = state.wearReactionCount >= 1;
              result.checks.wearReachedBreakState = state.wearHighestState >= 3;
              result.checks.wearTargetRecorded = Boolean(state.wearLastType);
              result.checks.noPageErrors = pageErrors.length === 0;

              await page.locator('#game').screenshot({
                path: OUT + '/' + arenaId + '-reaction.png',
                timeout: 90000,
              });

              result.passed = Object.values(result.checks).every(Boolean);
            } catch (error) {
              result.failure = String(error);
              try {
                await page.screenshot({
                  path: OUT + '/' + arenaId + '-failure.png',
                  fullPage: true,
                  timeout: 30000,
                });
              } catch {}
            } finally {
              await page.close();
            }
            return result;
          }

          const cases = [
            { arenaId: 'ring', ambientMarker: 'danao-store-scan-glow', detailMarker: 'danao-detail-trolley-frame', wearMarker: 'danao-wear-ring-dent' },
            { arenaId: 'courtyard', ambientMarker: 'danao-courtyard-petal', detailMarker: 'danao-detail-gong', wearMarker: 'danao-wear-courtyard-crack' },
            { arenaId: 'rooftop', ambientMarker: 'danao-rooftop-steam', detailMarker: 'danao-detail-rooftop-duct', wearMarker: 'danao-wear-rooftop-spark' },
          ];
          const results = [];
          for (const entry of cases) results.push(await capture(entry));

          const release = await (await context.request.get(BASE + '/games/danao/release.json')).json();
          const report = {
            release,
            results,
            passed: (() => {
              const [major, minor, patch] = release.version.split('.').map(Number);
              return major * 1_000_000 + minor * 1_000 + patch >= 10_012
                && results.every((result) => result.passed);
            })(),
          };
          fs.writeFileSync(OUT + '/living-arenas-qa.json', JSON.stringify(report, null, 2));
          await browser.close();

          console.log(JSON.stringify(report, null, 2));
          if (!report.passed) process.exit(1);
          EOF

          node verification/danao-living/living-runner.mjs

      - name: Upload living arena QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danao-living-arenas-qa
          path: verification/danao-living/
          if-no-files-found: error
          retention-days: 7
