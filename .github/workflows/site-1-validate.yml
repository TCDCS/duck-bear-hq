name: Site 1 validation
on:
  push:
    branches: [site-1-storybook-20260929]
  pull_request:
    branches: [main]
    paths: ['src/site/**','public/site/**','tests/site-*','migrations/0004*','.github/workflows/site-1-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and regression tests
        run: npm test
      - name: Repository checks
        run: npm run check
      - name: Build the actual Cloudflare Worker
        run: npx wrangler deploy --dry-run --outdir /tmp/site-1-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser acceptance with isolated fixture data
        env:
          SITE_SCREENSHOTS: /tmp/site-1-evidence
        run: |
          node tests/helpers/site-server.mjs > /tmp/site-1-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/api/site/health >/dev/null && break
            sleep 1
          done
          python tests/site-browser.py
      - name: Export review evidence
        if: always()
        run: |
          mkdir -p /tmp/site-1-evidence
          git archive --format=tar HEAD | gzip > /tmp/site-1-evidence/source.tar.gz
          git rev-parse HEAD > /tmp/site-1-evidence/commit.txt
          cp /tmp/site-1-server.log /tmp/site-1-evidence/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-1-evidence
          path: /tmp/site-1-evidence/
          retention-days: 7
