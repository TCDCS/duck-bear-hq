name: Site reconciliation
on:
  push:
    branches: [fix/site-1-2-reconciled]
    paths: [.github/workflows/site-reconcile.yml]
permissions:
  contents: write
concurrency:
  group: site-reconciliation-assembly
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble checksummed reviewed source on isolated branch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess,shutil
          root=pathlib.Path.cwd()
          encoded=''.join((root/f'.github/site-transfer/part-{n}.b64').read_text().strip() for n in range(1,5))
          compressed=base64.b64decode(encoded,validate=True)
          expected='8126f86499d2fc0990ba79209aed9f5c74d1bdbf4c4cf2f6acace84316730f12'
          assert hashlib.sha256(compressed).hexdigest()==expected,'Source transfer checksum mismatch'
          manifest=json.loads(gzip.decompress(compressed))
          assert manifest['base_sha']=='4df31885f973ff270ffb885532a297d097059108'
          assert manifest['source_sha']=='850f3a25dc38dbac835d5a3924d5700622ac3797'
          subprocess.run(['git','checkout',manifest['source_sha'],'--',*manifest['checkout']],check=True)
          for name,change in manifest['files'].items():
              path=root/name
              assert path.resolve().is_relative_to(root)
              old=path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest()==change['old_sha256'],f'Unexpected baseline: {name}'
              text=old.decode('utf-8')
              for start,end,replacement in reversed(change['edits']):
                  text=text[:start]+replacement+text[end:]
              result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==change['new_sha256'],f'Unexpected output: {name}'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
          shutil.rmtree(root/'.github/site-transfer')
          (root/'.github/workflows/site-reconcile.yml').unlink()
          print('Verified and assembled all',len(manifest['files']),'reconciled files; no production data accessed.')
          PY
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Worker bundle dry run
        run: npx wrangler deploy --dry-run --outdir /tmp/hq-worker
      - name: Actual Workers D1 and R2 acceptance
        run: |
          set -euo pipefail
          mkdir -p hq-browser-report
          npx wrangler d1 migrations apply DB --local
          npx wrangler dev --ip 127.0.0.1 --port 8790 --var SETUP_SECRET:hq-fixture-setup >/tmp/hq-workers.log 2>&1 &
          worker=$!
          trap 'kill "$worker" || true; cp /tmp/hq-workers.log hq-browser-report/workers.log' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:8790/api/hq/auth/status >/dev/null && break; sleep 1; done
          node scripts/hq-worker-smoke.mjs | tee hq-browser-report/worker-acceptance.txt
      - name: Install browser acceptance tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser acceptance with isolated test accounts
        env:
          BASE_URL: http://127.0.0.1:8789
          HQ_REPORT: hq-browser-report
        run: |
          set -euo pipefail
          node tests/helpers/hq-browser-server.mjs >/tmp/hq-fixture.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS "$BASE_URL/api/hq/auth/status" >/dev/null && break; sleep 1; done
          python tests/hq-browser.py
          python tests/site-browser.py
      - name: Commit only the tested candidate to its isolated branch
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only 4df31885f973ff270ffb885532a297d097059108 -- public/games)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public tests scripts docs .github package.json package-lock.json wrangler.jsonc
          git commit -m 'Reconcile Site 1 and Site 2 into private illustrated HQ 7.1.0'
          git push origin HEAD:fix/site-1-2-reconciled
      - name: Save actual screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hq-browser-report
          path: hq-browser-report/
          retention-days: 7
