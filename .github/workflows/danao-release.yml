name: Danao Production WebGL Release

on:
  push:
    branches: [main]
    paths:
      - 'unity/danao/**'
      - '.github/workflows/danao-release.yml'
  workflow_dispatch:

concurrency:
  group: danao-production-webgl
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  UNITY_UBA_API: https://build-automation.services.api.unity.com/v2
  UNITY_UBA_AUTH: ${{ secrets.UNITY_UBA_AUTH }}
  UNITY_UBA_ORG_ID: ${{ secrets.UNITY_UBA_ORG_ID }}
  UNITY_UBA_PROJECT_ID: ${{ secrets.UNITY_UBA_PROJECT_ID }}
  DANAO_RELEASE_ORIGIN: https://duck-bear-hq.zachary-chambers2.workers.dev
  DANAO_WINDOWS_MINUTE_GUARD: 150

jobs:
  build-and-publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity release credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_UBA_AUTH" || { echo 'Missing UNITY_UBA_AUTH'; exit 1; }
          test -n "$UNITY_UBA_ORG_ID" || { echo 'Missing UNITY_UBA_ORG_ID'; exit 1; }
          test -n "$UNITY_UBA_PROJECT_ID" || { echo 'Missing UNITY_UBA_PROJECT_ID'; exit 1; }

      - name: Resolve Danao WebGL target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          TARGET_NAME="Danao WebGL"
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > buildtargets.json
          TARGET_ID="$(jq -r --arg name "$TARGET_NAME" '
            def rows:
              if type == "array" then .
              elif (.buildtargets? | type) == "array" then .buildtargets
              elif (.buildTargets? | type) == "array" then .buildTargets
              elif (.targets? | type) == "array" then .targets
              else [] end;
            rows
            | map(select((.name // .targetName // .buildTargetName // .displayName // "") == $name))
            | .[0]
            | (.buildtargetid // .buildTargetId // .id // .name // empty)
          ' buildtargets.json)"
          test -n "$TARGET_ID" && test "$TARGET_ID" != "null" || { echo "Could not resolve $TARGET_NAME" >&2; exit 1; }
          echo "id=$TARGET_ID" >> "$GITHUB_OUTPUT"

      - name: Set Unity concurrency limit to one
        shell: bash
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/concurrency-limit"
          HTTP="$(curl --silent --show-error \
            -o concurrency.json \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: $UNITY_UBA_AUTH" \
            -H 'Content-Type: application/json' \
            --data '{"limit":1}' \
            "$URL")"
          if [ "$HTTP" = "403" ]; then
            echo "Unity org concurrency is admin-only for this token; continuing with GitHub serialization and stale-build cancellation."
          elif [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Could not set Unity concurrency limit to one (HTTP $HTTP)." >&2
            cat concurrency.json >&2 || true
            exit 1
          else
            echo "Unity Build Automation concurrency is limited to one build."
          fi

      - name: Cancel stale Danao WebGL builds
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          HTTP="$(curl --silent --show-error \
            -o cancel-builds.json \
            -w '%{http_code}' \
            -X DELETE \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds")"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Unity Build Automation stale-build cancellation returned HTTP $HTTP" >&2
            cat cancel-builds.json >&2 || true
            exit 1
          fi
          echo "Canceled any stale Danao WebGL builds (HTTP $HTTP)."
          sleep 2

      - name: Configure Danao WebGL for Windows Micro
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          MACHINE_URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/machinetypes?operatingSystem=windows"
          TARGET_URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID"

          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$MACHINE_URL" > machine-types.json

          MICRO_LABEL="$(jq -r '
            def rows:
              if type == "array" then .
              elif (.machineTypes? | type) == "array" then .machineTypes
              elif (.machinetypes? | type) == "array" then .machinetypes
              else [] end;
            rows
            | map(select((.freeTierEligible // false) == true))
            | map(select((((.name // "") + " " + (.shortName // "") + " " + (.label // "")) | ascii_downcase) | contains("micro")))
            | .[0]
            | (.name // .shortName // .label // empty)
          ' machine-types.json)"
          test -n "$MICRO_LABEL" && test "$MICRO_LABEL" != "null" || {
            echo 'Unity did not expose a free-tier-eligible Windows Micro machine.' >&2
            jq -c '.[]? | {name,shortName,label,operatingSystem,freeTierEligible,enabled}' machine-types.json >&2 || true
            exit 1
          }

          OS_VERSION="$(jq -r --arg machine "$MICRO_LABEL" '
            def rows:
              if type == "array" then .
              elif (.machineTypes? | type) == "array" then .machineTypes
              elif (.machinetypes? | type) == "array" then .machinetypes
              else [] end;
            rows
            | map(select((.name // .shortName // .label // "") == $machine))
            | .[0]
            | (.operatingSystemVersions // [])
            | .[0]
            | if type == "string" then . else (.name // .value // .version // empty) end
          ' machine-types.json)"
          test -n "$OS_VERSION" && test "$OS_VERSION" != "null" || { echo "Windows Micro '$MICRO_LABEL' has no usable OS version." >&2; exit 1; }

          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$TARGET_URL" > target-before.json

          jq --arg machine "$MICRO_LABEL" --arg osVersion "$OS_VERSION" '
            {
              name: (.name // .targetName),
              platform: .platform,
              targetType: .targetType,
              enabled: (.enabled // true),
              generateProjectPreview3D: (.generateProjectPreview3D // false),
              scenePreview: (.scenePreview // false),
              settings: ((.settings // {}) + {
                machineTypeLabel: $machine,
                operatingSystemSelected: "windows",
                operatingSystemVersion: $osVersion,
                architecture: "x86_64",
                windowsGitBinary: "inherit"
              }),
              credentials: (.credentials // [])
            }
          ' target-before.json > target-update.json

          HTTP="$(curl --silent --show-error \
            -o target-update-response.json \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: $UNITY_UBA_AUTH" \
            -H 'Content-Type: application/json' \
            --data-binary @target-update.json \
            "$TARGET_URL")"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Could not configure Danao WebGL for Windows Micro (HTTP $HTTP)." >&2
            cat target-update-response.json >&2 || true
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$TARGET_URL" > target-after.json
          ACTIVE_OS="$(jq -r '.settings.operatingSystemSelected // empty' target-after.json | tr '[:upper:]' '[:lower:]')"
          ACTIVE_MACHINE="$(jq -r '.settings.machineTypeLabel // empty' target-after.json)"
          test "$ACTIVE_OS" = "windows" || { echo "Danao target still reports OS '$ACTIVE_OS'." >&2; exit 1; }
          test "$ACTIVE_MACHINE" = "$MICRO_LABEL" || { echo "Danao target reports '$ACTIVE_MACHINE', expected '$MICRO_LABEL'." >&2; exit 1; }
          echo "Danao WebGL now uses Windows Micro machine '$MICRO_LABEL' ($OS_VERSION)."

      - name: Guard Danao monthly Windows minutes
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds?limit=100"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > monthly-builds.json
          MONTH_START="$(date -u +%Y-%m-01T00:00:00Z)"
          USED_SECONDS="$(jq -r --arg start "$MONTH_START" '
            def rows:
              if type == "array" then .
              elif (.builds? | type) == "array" then .builds
              else [] end;
            [rows[]
              | select((.created // .createdAt // .createdDate // .queuedAt // .startTime // "") >= $start)
              | select((((.operatingSystem // .machineType.operatingSystem // .machineTypeOperatingSystem // "") | ascii_downcase) == "windows"))
              | (.billableTimeInSeconds // 0)
            ] | add // 0
          ' monthly-builds.json)"
          USED_MINUTES=$(( (USED_SECONDS + 59) / 60 ))
          echo "Danao Windows Build Automation usage this month: ${USED_MINUTES} minutes; guard: ${DANAO_WINDOWS_MINUTE_GUARD} minutes."
          if [ "$USED_MINUTES" -ge "$DANAO_WINDOWS_MINUTE_GUARD" ]; then
            echo "Stopping before another paid Danao build: Windows usage reached the ${DANAO_WINDOWS_MINUTE_GUARD}-minute safety guard." >&2
            exit 1
          fi

      - name: Start exact main-commit Unity build
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds"
          BODY="$(jq -nc --arg branch "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" '{clean:false,branch:$branch,commit:$commit}')"
          HTTP="$(curl --silent --show-error \
            -o build-start.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: $UNITY_UBA_AUTH" \
            -H 'Content-Type: application/json' \
            --data "$BODY" \
            "$URL")"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            echo "Unity Build Automation returned HTTP $HTTP" >&2
            cat build-start.json >&2 || true
            exit 1
          fi
          echo "Requested Danao WebGL for commit $GITHUB_SHA (HTTP $HTTP)."

      - name: Find exact Unity build number
        id: build
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds?limit=25"
          NUMBER=""
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: $UNITY_UBA_AUTH" \
              "$URL" > builds.json
            NUMBER="$(jq -r --arg commit "$GITHUB_SHA" '
              def rows:
                if type == "array" then .
                elif (.builds? | type) == "array" then .builds
                else [] end;
              rows
              | map(select((.requestedRevision // .scmCommitId // .commit // .revision // .scmRevision // "") == $commit))
              | .[0]
              | (.buildNumber // .build // .number // empty)
            ' builds.json)"
            if [ -n "$NUMBER" ] && [ "$NUMBER" != "null" ]; then break; fi
            echo "Waiting for Unity to register requestedRevision $GITHUB_SHA ($attempt/60)"
            sleep 5
          done
          test -n "$NUMBER" && test "$NUMBER" != "null" || { echo "Unity did not register requestedRevision $GITHUB_SHA." >&2; exit 1; }
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Unity build #$NUMBER requested $GITHUB_SHA."

      - name: Wait for WebGL success
        id: wait
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds/$BUILD_NUMBER"
          STATUS=""
          REQUESTED_REVISION=""
          for attempt in $(seq 1 120); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: $UNITY_UBA_AUTH" \
              "$URL" > build.json
            REQUESTED_REVISION="$(jq -r '.requestedRevision // empty' build.json)"
            if [ "$REQUESTED_REVISION" != "$GITHUB_SHA" ]; then
              echo "Unity build #$BUILD_NUMBER requested unexpected revision '$REQUESTED_REVISION' instead of '$GITHUB_SHA'." >&2
              exit 1
            fi
            STATUS="$(jq -r '.buildStatus // .status // "unknown"' build.json | tr '[:upper:]' '[:lower:]')"
            echo "Unity build #$BUILD_NUMBER: $STATUS ($attempt/120)"
            case "$STATUS" in
              success|failure|canceled|unknown) break ;;
            esac
            sleep 20
          done
          if [ "$STATUS" != "success" ]; then
            echo "Unity production build ended with status '$STATUS'." >&2
            exit 1
          fi
          BUILT_REVISION="$(jq -r '.lastBuiltRevision // empty' build.json)"
          if [ "$BUILT_REVISION" != "$GITHUB_SHA" ]; then
            echo "Unity build #$BUILD_NUMBER completed revision '$BUILT_REVISION', expected '$GITHUB_SHA'." >&2
            exit 1
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "Unity build #$BUILD_NUMBER verified lastBuiltRevision $BUILT_REVISION."

      - name: Download verified WebGL payload
        shell: bash
        env:
          TARGET_ID: ${{ steps.target.outputs.id }}
          BUILD_NUMBER: ${{ steps.build.outputs.number }}
        run: |
          set -euo pipefail
          URL="$UNITY_UBA_API/orgs/$UNITY_UBA_ORG_ID/projects/$UNITY_UBA_PROJECT_ID/buildtargets/$TARGET_ID/builds/$BUILD_NUMBER/artifacts"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: $UNITY_UBA_AUTH" \
            "$URL" > unity-artifacts.json
          mkdir -p playable/Build

          download_file() {
            SOURCE_NAME="$1"
            OUTPUT_NAME="$2"
            MIN_BYTES="$3"
            HREF="$(jq -r --arg name "$SOURCE_NAME" '[.[] | select(.name == "All Artifacts") | .files[] | select(.filename == $name) | .href][0] // empty' unity-artifacts.json)"
            test -n "$HREF" || { echo "Missing Unity WebGL artifact: $SOURCE_NAME" >&2; exit 1; }
            SIGNED_RESPONSE="$(curl --fail-with-body --silent --show-error -H "Authorization: $UNITY_UBA_AUTH" "$HREF")"
            SIGNED_URL="$(printf '%s' "$SIGNED_RESPONSE" | jq -r 'if type == "string" then . elif .href? then .href elif .url? then .url else empty end')"
            test -n "$SIGNED_URL" || { echo "Missing signed URL for $SOURCE_NAME" >&2; exit 1; }
            curl --fail-with-body --location --silent --show-error "$SIGNED_URL" -o "playable/Build/$OUTPUT_NAME"
            SIZE="$(stat -c%s "playable/Build/$OUTPUT_NAME")"
            if [ "$SIZE" -lt "$MIN_BYTES" ]; then
              echo "$OUTPUT_NAME is too small ($SIZE bytes)." >&2
              exit 1
            fi
          }

          download_file 'Danao WebGL/Build/Danao WebGL.loader.js' 'Danao.loader.js' 10000
          download_file 'Danao WebGL/Build/Danao WebGL.data' 'Danao.data' 1000000
          download_file 'Danao WebGL/Build/Danao WebGL.framework.js' 'Danao.framework.js' 100000
          download_file 'Danao WebGL/Build/Danao WebGL.wasm' 'Danao.wasm' 1000000
          ls -lh playable/Build

      - name: Preserve production WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: danao-webgl-production-${{ steps.build.outputs.number }}
          path: playable/Build
          if-no-files-found: error
          retention-days: 30

      - name: Wait for Danao release upload route
        shell: bash
        run: |
          set -euo pipefail
          READY=""
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "$DANAO_RELEASE_ORIGIN/api/danao/release/health" > release-health.json; then
              AUTH="$(jq -r '.auth // empty' release-health.json)"
              if [ "$AUTH" = "github-actions" ]; then
                READY=1
                break
              fi
            fi
            echo "Waiting for the merged Worker release route ($attempt/60)"
            sleep 10
          done
          test -n "$READY" || { echo 'Danao release upload route did not become ready.' >&2; exit 1; }

      - name: Publish Danao WebGL current channel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for NAME in Danao.data Danao.framework.js Danao.wasm Danao.loader.js; do
            FILE="playable/Build/$NAME"
            test -s "$FILE"
            case "$NAME" in
              *.js) TYPE='application/javascript; charset=utf-8' ;;
              *.wasm) TYPE='application/wasm' ;;
              *) TYPE='application/octet-stream' ;;
            esac
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              -X PUT \
              --data-binary "@$FILE" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-Danao-Run-Id: $GITHUB_RUN_ID" \
              -H "X-Danao-Commit: $GITHUB_SHA" \
              -H "Content-Type: $TYPE" \
              "$DANAO_RELEASE_ORIGIN/api/danao/release/$NAME"
            echo
          done

          for NAME in Danao.loader.js Danao.data Danao.framework.js Danao.wasm; do
            curl --fail --silent --show-error --head --retry 5 --retry-delay 2 \
              "$DANAO_RELEASE_ORIGIN/game-builds/danao/web/current/$NAME" >/dev/null
          done

          {
            echo "### Danao production release"
            echo "Unity build **#${{ steps.build.outputs.number }}**"
            echo "Commit: \`$GITHUB_SHA\`"
            echo "Published through the authenticated Worker route to R2 channel **current**."
          } >> "$GITHUB_STEP_SUMMARY"
