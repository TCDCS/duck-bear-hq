name: Danao Mobile Touch QA

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/danao-*']
    paths:
      - 'public/games/danao/src/mobile/**'
      - 'public/games/danao/src/main.js'
      - 'public/games/danao/index.html'
      - 'public/games/danao/release.json'
      - 'tests/danao-v0108-mobile-touch.test.mjs'
      - '.github/workflows/danao-mobile-touch-qa.yml'

permissions:
  contents: read

concurrency:
  group: danao-mobile-touch-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Assemble exact Danao release
        run: npm run assemble:danao

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8080 --directory public > /tmp/danao-mobile-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/games/danao/release.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/danao-mobile-http.log
          exit 1

      - name: Exercise landscape touch controls
        run: |
          mkdir -p verification/danao-mobile
          cat > verification/danao-mobile/mobile-runner.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const OUT = 'verification/danao-mobile';
          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 844, height: 390 },
            screen: { width: 844, height: 390 },
            isMobile: true,
            hasTouch: true,
            deviceScaleFactor: 2,
            serviceWorkers: 'block',
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(String(error)));

          const report = { passed: false, checks: {}, pageErrors };
          try {
            await page.goto('http://127.0.0.1:8080/games/danao/?touch=1', {
              waitUntil: 'domcontentloaded',
              timeout: 90000,
            });

            await page.evaluate(() => {
              globalThis.__DANAO_TOUCH_KEYS = [];
              addEventListener('keydown', (event) => globalThis.__DANAO_TOUCH_KEYS.push(['down', event.code]));
              addEventListener('keyup', (event) => globalThis.__DANAO_TOUCH_KEYS.push(['up', event.code]));
            });

            await page.locator('[data-action="play"]').waitFor({ state: 'visible', timeout: 30000 });
            await page.locator('[data-action="play"]').click();
            await page.locator('[data-action="start"]').click();

            await page.locator('.danao-touch-shell.is-active').waitFor({
              state: 'visible',
              timeout: 90000,
            });
            await page.waitForTimeout(1000);

            const up = page.locator('[data-touch-action="up"]');
            const left = page.locator('[data-touch-action="left"]');
            const jump = page.locator('[data-touch-action="jump"]');

            await up.dispatchEvent('pointerdown', { pointerId: 11, pointerType: 'touch', isPrimary: true });
            await left.dispatchEvent('pointerdown', { pointerId: 12, pointerType: 'touch', isPrimary: false });
            await jump.dispatchEvent('pointerdown', { pointerId: 13, pointerType: 'touch', isPrimary: false });
            await page.waitForTimeout(100);
            await jump.dispatchEvent('pointerup', { pointerId: 13, pointerType: 'touch', isPrimary: false });
            await left.dispatchEvent('pointerup', { pointerId: 12, pointerType: 'touch', isPrimary: false });
            await up.dispatchEvent('pointerup', { pointerId: 11, pointerType: 'touch', isPrimary: true });

            const state = await page.evaluate(() => {
              const shell = document.querySelector('.danao-touch-shell');
              const buttons = [...document.querySelectorAll('.danao-touch-btn')];
              const leftPad = document.querySelector('.danao-touch-move')?.getBoundingClientRect();
              const rightPad = document.querySelector('.danao-touch-actions')?.getBoundingClientRect();
              return {
                keys: globalThis.__DANAO_TOUCH_KEYS || [],
                buttonBoxes: buttons.map((button) => {
                  const rect = button.getBoundingClientRect();
                  return { width: rect.width, height: rect.height };
                }),
                shellVisible: Boolean(shell && getComputedStyle(shell).display !== 'none'),
                leftPad: leftPad ? { left: leftPad.left, right: leftPad.right, bottom: leftPad.bottom } : null,
                rightPad: rightPad ? { left: rightPad.left, right: rightPad.right, bottom: rightPad.bottom } : null,
                width: innerWidth,
                height: innerHeight,
              };
            });

            report.landscape = state;
            report.checks.shellVisible = state.shellVisible;
            report.checks.largeEnoughTargets = state.buttonBoxes.every((box) => box.width >= 43 && box.height >= 43);
            report.checks.separateThumbZones =
              state.leftPad && state.rightPad
              && state.leftPad.right < state.width * 0.46
              && state.rightPad.left > state.width * 0.54;
            report.checks.withinViewport =
              state.leftPad?.bottom <= state.height + 1
              && state.rightPad?.bottom <= state.height + 1;

            const keyStrings = state.keys.map((entry) => entry.join(':'));
            for (const expected of [
              'down:KeyW',
              'down:KeyA',
              'down:Space',
              'up:Space',
              'up:KeyA',
              'up:KeyW',
            ]) {
              report.checks['key_' + expected.replace(':', '_')] = keyStrings.includes(expected);
            }

            await page.screenshot({ path: OUT + '/touch-landscape.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(250);
            report.checks.portraitRotateHint = await page.locator('.danao-rotate-hint').evaluate((el) => {
              const style = getComputedStyle(el);
              return style.display !== 'none' && style.visibility !== 'hidden';
            });
            await page.screenshot({ path: OUT + '/touch-portrait.png', fullPage: true });

            report.checks.noPageErrors = pageErrors.length === 0;
            report.passed = Object.values(report.checks).every(Boolean);
          } catch (error) {
            report.failure = String(error);
            try {
              await page.screenshot({ path: OUT + '/touch-failure.png', fullPage: true });
            } catch {}
          } finally {
            fs.writeFileSync(OUT + '/mobile-touch-qa.json', JSON.stringify(report, null, 2));
            await browser.close();
          }

          console.log(JSON.stringify(report, null, 2));
          if (!report.passed) process.exit(1);
          EOF

          node verification/danao-mobile/mobile-runner.mjs

      - name: Upload mobile touch QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: danao-mobile-touch-qa
          path: verification/danao-mobile/
          if-no-files-found: error
          retention-days: 7
