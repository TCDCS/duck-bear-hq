name: Published game acceptance
on:
  push:
    branches: [release/finish-live-20260912]
    paths: ['.github/workflows/release-diagnostics.yml', 'tests/live-acceptance.py']
permissions:
  contents: read
jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the exact release source for review
        run: |
          mkdir -p verification
          git archive --format=zip --output=verification/reviewed-source.zip HEAD src public tests scripts docs migrations wrangler.jsonc package.json package-lock.json
      - name: Check simulation and public/private boundaries
        run: |
          npm test
          npm run check
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify hosted files match the release
        run: python scripts/wait-live.py
      - name: Complete a live race with two independent guest browsers
        run: python tests/browser_clients.py
      - name: Keep release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wacky-live-acceptance
          path: verification/
          retention-days: 7
