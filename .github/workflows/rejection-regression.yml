name: Final room regression
on:
  push:
    branches: [release/finish-live-20260912]
    paths: ['tests/room-rejection.test.mjs','src/multiplayer/durable.mjs','.github/workflows/rejection-regression.yml']
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run all regressions and build the deployable Worker
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check
          npx wrangler deploy --dry-run --outdir /tmp/wacky-build
          python -m pip install aiohttp
      - name: Verify eight native clients against the patched Workers runtime
        env:
          BASE_URL: http://127.0.0.1:8787
        run: |
          mkdir -p verification
          npx wrangler dev --ip 127.0.0.1 --port 8787 > verification/wrangler.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/api/races/version && break; sleep 1; done
          python tests/live-room-smoke.py
      - name: Inspect published files with the corrected release probe
        env:
          BASE_URL: https://duck-bear-hq.zachary-chambers2.workers.dev
        run: python scripts/wait-live.py
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-room-regression
          path: verification/
          retention-days: 7
